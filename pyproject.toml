[project]
name = 'ziptrigo-apps'
version = '0.1.0'
description = 'ZipTrigo Django applications monorepo'
requires-python = '>=3.14'
dependencies = [
    'boto3>=1.34,<2.0',
    'django-cors-headers>=4.3,<5.0',
    'django-jazzmin>=3.0,<4.0',
    'django-ninja-extra>=0.30,<1.0',
    'django-ninja-jwt>=5.4,<6.0',
    'django-ninja>=1.5,<2.0',
    'django-ses>=4.0,<5.0',
    'django>=6.0,<6.1',
    'jinja2>=3.1,<4.0',
    'pydantic[email]>=2.12,<3.0',
    'pyjwt[crypto]>=2.10,<3.0',
    'python-dotenv>=1.0,<2.0',
    'whitenoise>=6.11,<7.0',
]

[dependency-groups]
users = []
qr_code = [
    'pillow>=12.0,<13.0',
    'segno>=1.6,<2.0',
]
dev = [
    # Dev-only type stubs for `mypy_boto3_ses`, needed for `ty` to resolve the `SESClient`
    # annotation in both services' `email_service.py` and in `admin/email.py`. The import of
    # `mypy_boto3_ses` itself never runs outside of type checking: it's behind `if TYPE_CHECKING:`
    # in both `email_service.py` modules, and function-local (so lazily deferred) in
    # `admin/email.py`. That's deliberate, not incidental -- Docker builds run
    # `uv sync --group <app>` without the dev group, so an unguarded top-level import in either
    # `email_service.py` would raise `ImportError` as soon as production code imported that module.
    # Don't drop this dependency without also checking those guards.
    'boto3-stubs[s3,ses]',
    'factory-boy',
    'faker',
    'playwright',
    'pytest',
    'pytest-asyncio',
    'pytest-cov',
    'pytest-django',
    'pytest-playwright',
    'pyyaml',
    'requests',
    'ruff',
    'segno>=1.6,<2.0',
    'pillow>=12.0,<13.0',
    'textual-searchable-selectionlist',
    'ty',
    'typer',
    'typer-invoke',
]

[tool.ruff]
line-length = 100
target-version = 'py314'
exclude = [
    '.venv*',
    'venv*',
    'migrations',
    'build',
    'dist',
    'docs',
]

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']
extend-ignore = ['E266', 'E501', 'E701', 'F811']

[tool.ruff.lint.per-file-ignores]
# These modules bind `User = get_user_model()` partway down the import block: it can only run once
# the app registry is populated, so the imports below it are unavoidably "not at top of file".
'qr_code/qr_code/services/email_confirmation.py' = ['E402']
'qr_code/qr_code/services/password_reset.py' = ['E402']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['tests.py', 'test_*.py', '*_tests.py', '*_test.py']
python_classes = ['Test*']
python_functions = ['test_*']
testpaths = ['tests']
addopts = [
  '--strict-markers',
  '--reuse-db',
  '--no-migrations',
  '-v',
  '--tb=short',
]
markers = [
  'unit: Unit tests',
  'integration: Integration tests',
  'slow: Slow running tests',
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = 'htmlcov'

# `ty` anchors patterns that don't start with `**` to the project root, unlike ruff's `exclude`,
# so these need the `**/` prefix to match nested directories (e.g. `qr_code/qr_code/migrations`)
# rather than only a top-level one.
#
# Dropped from `[tool.mypy]` with no `ty` equivalent: `check_untyped_defs` / `disallow_untyped_defs`
# are moot (`ty` checks everything) and `python_version` is covered by `requires-python`, but
# `warn_return_any` has no `ty` equivalent and is silently gone.
[tool.ty.src]
exclude = [
    '**/migrations',
    '**/.venv*',
    '**/venv*',
]

[tool.typer-invoke]
modules = [
    'admin.aws',
    'admin.email',
    'admin.lint',
    'admin.openapi',
    'admin.pip',
    'admin.qrcode',
    'admin.server',
    'admin.test',
]
