[project]
name = 'ziptrigo-apps'
version = '0.1.0'
description = 'ZipTrigo Django applications monorepo'
requires-python = '>=3.14'
dependencies = [
    # Server-side OAuth 2.0 / OpenID Connect client for "Sign in with Google" (issue #91).
    # Its Django integration fetches Google's discovery document and exchanges the authorization
    # code over `requests`, which is therefore a runtime dependency too, not a dev-only one.
    'authlib>=1.6,<2.0',
    'boto3>=1.34,<2.0',
    'dj-database-url>=3.1,<4.0',
    'django-jazzmin>=3.0,<4.0',
    'django-ninja-extra>=0.30,<1.0',
    'django-ninja-jwt>=5.4,<6.0',
    'django-ninja>=1.5,<2.0',
    'django-tasks-db>=0.13,<1.0',
    'django>=6.1,<6.2',
    # Country of a click from a MaxMind GeoLite2-Country database (`GEOIP_PATH`; issue #162).
    'geoip2>=5.0,<6.0',
    'gunicorn>=26.2,<27.0',
    # Bare-URL detection for markdown-it's `linkify` option (`apps.core.markdown`, issue #176).
    'linkify-it-py>=2.0,<3.0',
    # CommonMark parser behind `apps.core.markdown`: the Markdown subset of descriptions and
    # comments, plain search text and checklist toggling (issue #176).
    'markdown-it-py>=3.0,<5.0',
    # `tasklists` plugin for markdown-it-py (`- [ ]` checklists; issue #176).
    'mdit-py-plugins>=0.4,<1.0',
    # HTML sanitizer applied to everything `apps.core.markdown.render` produces (issue #176);
    # `bleach` is deprecated.
    'nh3>=0.2,<1.0',
    # OpenAI-compatible client for receipt extraction (issue #98); used with an explicit timeout
    # and a bounded `max_retries` (`apps.receipts.services.ai`).
    'openai>=3.0,<4.0',
    'pillow>=13.0,<14.0',
    # HEIC/HEIF decoding for receipt photos (registers a Pillow opener; issue #98).
    'pillow-heif>=1.0,<2.0',
    'psycopg[binary]>=3.3,<4.0',
    'pydantic[email]>=2.12,<3.0',
    # PDF text extraction (`pypdf`) and page rendering for scanned PDFs (`pypdfium2`) for receipts.
    'pypdf>=6.20,<7.0',
    'pypdfium2>=5.0,<6.0',
    'pyjwt[crypto]>=2.10,<3.0',
    # RRULE parsing and iteration (`dateutil.rrule`) for repeating To-do tasks (issue #179).
    'python-dateutil>=2.9,<3.0',
    'python-dotenv>=1.0,<2.0',
    # `regex` for the search snippets only: unlike `re` its `search(timeout=...)` is bounded, so a
    # pattern that backtracks badly can't hang a web worker (`apps.todo.services.search`, #181).
    'regex>=2025.1,<2027.0',
    'requests>=2.32,<3.0',
    'segno>=1.6,<2.0',
    # User-agent parsing (device, browser, OS, crawler detection) for short link analytics
    # (issue #162). `ua-parser` itself, not `user-agents`: that wrapper is unmaintained and only
    # adds the few boolean helpers `apps.short_url.services.useragents` writes in a few lines.
    'ua-parser>=1.0,<2.0',
    'whitenoise>=6.11,<7.0',
]

[dependency-groups]
dev = [
    # Dev-only type stubs for `mypy_boto3_ses`, needed for `ty` to resolve the `SESClient`
    # annotation in `apps/core/services/email.py` and in `admin/email.py`. The import of
    # `mypy_boto3_ses` itself never runs outside of type checking: it's behind `if TYPE_CHECKING:`
    # in `apps/core/services/email.py`, and function-local (so lazily deferred) in
    # `admin/email.py`. That's deliberate, not incidental --
    # the Docker build runs `uv sync --no-dev`, so this group is not in the image and an unguarded
    # top-level import in `apps/core/services/email.py` would raise `ImportError` as soon as
    # production code imported that module.
    # Don't drop this dependency without also checking those guards.
    'boto3-stubs[s3,ses]',
    'factory-boy',
    'faker',
    'fsspec',
    'import-linter',
    'playwright',
    'pytest',
    'pytest-asyncio',
    'pytest-cov',
    'pytest-django',
    'pytest-playwright',
    'pyyaml',
    'pyzipper',
    'ruff',
    's3fs>=2026.4.0',
    'ty',
    'typer',
    'typer-invoke',
]

[tool.ruff]
line-length = 100
target-version = 'py314'
exclude = [
    '.venv*',
    'venv*',
    'migrations',
    'build',
    'dist',
    'docs',
]

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']
extend-ignore = ['E266', 'E501', 'E701', 'F811']

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = 'config.settings'
python_files = ['tests.py', 'test_*.py', '*_tests.py', '*_test.py']
python_classes = ['Test*']
python_functions = ['test_*']
pythonpath = ['.']
testpaths = ['apps', 'admin']
addopts = [
  '--strict-markers',
  '--reuse-db',
  '--no-migrations',
  '-v',
  '--tb=short',
]
markers = [
  'unit: Unit tests',
  'integration: Integration tests',
  'slow: Slow running tests',
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = 'htmlcov'

# `ty` anchors patterns that don't start with `**` to the project root, unlike ruff's `exclude`,
# so these need the `**/` prefix to match nested directories (e.g. `apps/qr_code/migrations`)
# rather than only a top-level one.
#
# Dropped from `[tool.mypy]` with no `ty` equivalent: `check_untyped_defs` / `disallow_untyped_defs`
# are moot (`ty` checks everything) and `python_version` is covered by `requires-python`, but
# `warn_return_any` has no `ty` equivalent and is silently gone.
[tool.ty.src]
exclude = [
    '**/migrations',
    '**/.venv*',
    '**/venv*',
]

[tool.typer-invoke]
modules = [
    'admin.aws',
    'admin.email',
    'admin.filetransfer',
    'admin.lint',
    'admin.openapi',
    'admin.pip',
    'admin.qrcode',
    'admin.receipts',
    'admin.secrets',
    'admin.server',
    'admin.shorturl',
    'admin.test',
    'admin.todo',
]

# Dependency rules between apps (`inv lint imports`). Each app may only import from the layers
# below it; apps in the same layer (the products) may not import each other at all. Tests are
# exempt: they may set up data through any app.
[tool.importlinter]
root_packages = ['apps']

[[tool.importlinter.contracts]]
name = 'Products -> billing | feedback -> accounts -> core'
type = 'layers'
layers = [
    'apps.qr_code | apps.file_transfer | apps.receipts | apps.short_url | apps.todo',
    'apps.billing | apps.feedback',
    'apps.accounts',
    'apps.core',
]
ignore_imports = [
    'apps.*.tests.** -> apps.**',
]
