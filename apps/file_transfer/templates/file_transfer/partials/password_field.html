{# The send pages' password input with a show/hide toggle (starts hidden). Expects `field`. #}
<div class="relative [&_input]:pr-10" x-data="{ shown: false }">
    {{ field }}
    <button type="button"
            class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
            @click="shown = !shown; $el.parentElement.querySelector('input').type = shown ? 'text' : 'password'"
            :aria-label="shown ? 'Hide password' : 'Show password'"
            :title="shown ? 'Hide password' : 'Show password'"
            aria-label="Show password">
        <i class="fas" :class="shown ? 'fa-eye-slash' : 'fa-eye'"></i>
    </button>
</div>
