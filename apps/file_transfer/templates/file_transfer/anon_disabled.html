{% extends 'core/base.html' %}

{% block title %}Send files - ZipTrigo{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-16 max-w-xl text-center">
    <i class="fas fa-circle-exclamation text-4xl text-gray-400 mb-4"></i>
    <h1 class="text-2xl font-bold mb-2 text-gray-900 dark:text-gray-100">Sending without an account isn't available right now</h1>
    <p class="text-gray-500 dark:text-gray-400 mb-6">
        <a href="{% url 'accounts:login' %}?next={% url 'file_transfer:send' %}" class="text-brand-primary hover:underline">Log in</a>
        to send files.
    </p>
</div>
{% endblock %}
