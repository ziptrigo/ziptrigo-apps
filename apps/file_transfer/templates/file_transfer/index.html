{% extends 'core/base.html' %}

{% block title %}File Transfer - ZipTrigo{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-10 max-w-3xl">
    <div class="flex items-center gap-3 mb-6">
        <i class="fas fa-paper-plane text-2xl text-sage-400"></i>
        <h1 class="text-3xl font-semibold">File Transfer</h1>
    </div>

    <p class="mb-8 text-gray-700 dark:text-gray-300">
        Send large files to anyone with a link that expires. Coming soon.
    </p>

    <section>
        <h2 class="text-xl font-semibold mb-4 pb-2 border-b border-sage-200 dark:border-sage-700">Your transfers</h2>
        <div id="transfer-list"
             hx-get="{% url 'file_transfer:transfer-list' %}"
             hx-trigger="load"
             hx-swap="innerHTML">
            <p class="text-gray-500 dark:text-gray-400">Loading&hellip;</p>
        </div>
    </section>
</div>
{% endblock %}
