{% extends 'core/base.html' %}

{% block title %}Transfer sent - ZipTrigo{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8 max-w-2xl text-center">
    <i class="fas fa-check-circle text-5xl text-sage-500 dark:text-sage-300 mb-4"></i>
    <h1 class="text-3xl font-semibold tracking-tight mb-4 text-gray-900 dark:text-gray-100">Your transfer is on its way</h1>
    <p class="text-gray-600 dark:text-gray-400 mb-6">
        We emailed the recipients and sent you a copy. Here's the link too:
    </p>
    <div class="bg-white dark:bg-gray-800 shadow-sm rounded-xl p-4 flex items-center gap-2 mb-6 border border-gray-200 dark:border-gray-700">
        <input type="text" readonly value="{{ download_url }}" id="download-url-input"
               class="flex-1 text-sm bg-transparent text-gray-900 dark:text-gray-100 border-none">
        <button type="button" id="copy-link-btn"
                class="btn px-3 py-1.5 rounded-lg text-sm bg-brand-primary text-gray-900 hover:bg-sage-400">
            <i class="fas fa-copy mr-1" aria-hidden="true"></i><span id="copy-link-label" aria-live="polite">Copy</span>
        </button>
    </div>
    <a href="{% url 'file_transfer:dashboard' %}" class="text-sage-600 dark:text-sage-300 hover:underline">Back to your transfers</a>
</div>
<script>
document.getElementById('copy-link-btn').addEventListener('click', function () {
    const input = document.getElementById('download-url-input');
    const label = document.getElementById('copy-link-label');
    input.select();
    const copied = function () {
        label.textContent = 'Copied';
        clearTimeout(label._timer);
        label._timer = setTimeout(function () { label.textContent = 'Copy'; }, 2000);
    };
    navigator.clipboard.writeText(input.value).then(copied, function () {
        if (document.execCommand('copy')) copied();
    });
});
</script>
{% endblock %}
