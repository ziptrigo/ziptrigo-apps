{% comment %}
An amount on the Costs page: `cost` ("1 credit", "Free", "Storage") with an optional `unit` under
it ("per file"). `free` greys it out.
{% endcomment %}
<span class="inline-flex flex-col items-end whitespace-nowrap rounded-lg px-2.5 py-1 text-sm {% if free %}font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300{% else %}font-semibold bg-sage-50 text-sage-700 dark:bg-sage-400/10 dark:text-sage-300{% endif %}" data-cost>
  {{ cost }}{% if unit %}<span class="text-xs font-normal">{{ unit }}</span>{% endif %}
</span>
