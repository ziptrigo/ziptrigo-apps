{% extends "core/base.html" %}

{% block title %}Redeem a promo code - ZipTrigo{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/70 dark:bg-gray-800/60 backdrop-blur rounded-2xl shadow-sm p-6">
    <div class="flex items-center gap-3 mb-6">
      <i class="fas fa-ticket-alt text-2xl text-sage-300"></i>
      <div>
        <h1 class="text-xl font-semibold">Redeem a promo code</h1>
        <p class="text-sm text-gray-600 dark:text-gray-300">
          Current balance: <span class="font-medium">{{ credits_balance }}</span> credits
        </p>
      </div>
    </div>

    {% include 'billing/partials/redeem_form.html' %}

    <p class="mt-6 text-sm">
      <a href="{% url 'billing:credits-history' %}" class="text-sage-300 hover:underline">
        <i class="fas fa-arrow-left mr-2"></i>Credits history
      </a>
    </p>
  </div>
</div>
{% endblock %}
