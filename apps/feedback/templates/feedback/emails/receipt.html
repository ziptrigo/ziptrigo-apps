<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2c3432; line-height: 1.5;">
  <p>{{ greeting }}</p>
  <p>Thanks for taking the time to send us your feedback. Every message is read.</p>
  <p>Here's a copy of what you sent on {{ date }} at {{ time }} UTC:</p>
  <blockquote style="margin: 0 0 16px; padding: 8px 16px; border-left: 4px solid #8fa89e; background: #f4f7f6; white-space: pre-wrap;">{{ description }}</blockquote>
  <p>The ZipTrigo team</p>
</div>
