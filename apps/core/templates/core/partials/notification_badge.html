{% load notification_tags %}{% comment %}The bell's count. It lives inside the bell's <button>, which has no aria-label (that would replace
   the name made from its content): the button's accessible name is its "Notifications" text plus this badge's
   sr-only sentence, so the number is spoken and follows every swap of this element. The visible digits are
   aria-hidden, to avoid saying the count twice. The element polls itself every 60 s while the tab is visible
   (and once when the tab becomes visible again) and replaces itself with the answer, so it must always be
   rendered, hidden when there is nothing new. `oob` swaps it into the page out of band, from a response about
   something else. Context: `count`, optionally `oob`. {% endcomment %}
<span id="notification-badge" hx-get="{% url 'core:notification-bell' %}" hx-trigger="every 60s [document.visibilityState === 'visible'], visibilitychange[document.visibilityState === 'visible'] from:document" hx-swap="outerHTML"
      {% if oob %}hx-swap-oob="true"{% endif %}
      class="pointer-events-none absolute -right-1 -top-1 min-w-[1.25rem] rounded-full bg-amber-400 px-1 text-center text-xs font-semibold leading-5 text-gray-900{% if not count %} hidden{% endif %}">
    {% if count %}<span aria-hidden="true">{{ count|badge_text }}</span><span class="sr-only">{{ count }} new notification{{ count|pluralize }}</span>{% endif %}
</span>
