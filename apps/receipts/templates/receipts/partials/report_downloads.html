{# The three downloads: links with the report's query string (free). Sent again, out of band, with every refresh. #}
<div id="report-downloads"{% if oob %} hx-swap-oob="true"{% endif %} class="flex flex-wrap items-center gap-2">
    <span class="mr-1 text-sm text-gray-600 dark:text-gray-300">Download</span>
    {% for download in downloads %}
    <a href="{{ download.url }}"
       class="btn inline-flex items-center rounded-lg bg-gray-100 px-3 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-200 dark:hover:bg-gray-600">
        <i class="{{ download.icon }} mr-2" aria-hidden="true"></i>{{ download.label }}<span class="sr-only"> report</span>
    </a>
    {% endfor %}
</div>
