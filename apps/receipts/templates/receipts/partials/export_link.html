{% comment %} The header's Export CSV link. Sent again, out of band, with every list refresh so it always
   carries the current filters. {% endcomment %}
<a id="export-link" href="{{ export_url }}"{% if oob %} hx-swap-oob="true"{% endif %}
   class="inline-flex items-center px-4 py-2 border border-gray-300 dark:border-gray-600 shadow-sm text-sm font-medium rounded-md text-gray-700 dark:text-gray-100 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-primary">
    <i class="fas fa-download mr-2" aria-hidden="true"></i>Export CSV
</a>
