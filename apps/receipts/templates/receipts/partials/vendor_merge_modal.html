{% comment %} The "Merge vendors" dialog (board 7), fetched into #vendor-modal. Same shell as the rename dialog;
   the form is its own partial so a refused merge can be swapped in place. {% endcomment %}
<div x-data="fragmentModal" @keydown.escape.window="close()" @click.self="close()"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 dark:bg-black/70">
    <div role="dialog" aria-modal="true" aria-labelledby="vendor-modal-title"
         class="max-h-[90vh] w-full max-w-md mx-4 overflow-y-auto rounded-lg bg-white dark:bg-gray-800 shadow-xl">
        {% include 'receipts/partials/vendor_merge_form.html' %}
    </div>
</div>
