{% comment %} One text field of an admin confirmation form: `field` is the bound field. {% endcomment %}
<div class="form-group">
    <label for="{{ field.id_for_label }}" class="font-weight-bold">{{ field.label }}{% if field.field.required %} <span class="text-danger" aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% for error in field.errors %}<div class="text-danger small mt-1">{{ error }}</div>{% endfor %}
    {% if field.help_text %}<small class="form-text text-muted">{{ field.help_text }}</small>{% endif %}
</div>
