<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2c3432; line-height: 1.5;">
  <p>{{ greeting }}</p>
  <p>The password for your ZipTrigo account ({{ email }}) was changed on {{ when }}.</p>
  <p>If you made this change, you can ignore this email.</p>
  <p>If you didn't, someone else may have access to your account. Reset your password now:</p>
  <p><a href="{{ forgot_password_url }}" style="color: #3b4a47;">{{ forgot_password_url }}</a></p>
  <p>--<br>The ZipTrigo Team</p>
</div>
