{% extends "core/base.html" %}
{% load static %}

{% block title %}Sign in - ZipTrigo{% endblock %}

{% block content %}
<div class="flex-grow flex items-center justify-center p-6">
  <div class="w-full max-w-md bg-white/70 dark:bg-gray-800/60 backdrop-blur rounded-2xl shadow-sm p-6 text-center">
    <div class="flex items-center justify-center gap-3 mb-6">
      <img src="{% static 'accounts/images/logo_128x128.png' %}" alt="" class="h-8 w-8">
      <h1 class="text-xl font-semibold">Sign in to ZipTrigo</h1>
    </div>

    <p class="mb-6">
      Press the button below to finish signing in.
    </p>

    <form method="post" action="{% url 'accounts:login-link' token %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
      <button type="submit"
              class="btn inline-flex justify-center items-center rounded-lg bg-brand-primary text-gray-900 font-medium px-4 py-2 hover:bg-sage-400 text-sm">
        Sign in
      </button>
    </form>
  </div>
</div>
{% endblock %}
