<form id="register-form"
      method="post"
      action="{% url 'accounts:register' %}"
      hx-post="{% url 'accounts:register' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}

  {% if form.errors %}
    <div class="mb-4 text-sm text-red-600" style="white-space: pre-line">
      {% for error in form.non_field_errors %}{{ error }}
{% endfor %}{% for field in form %}{% for error in field.errors %}{{ field.label }}: {{ error }}
{% endfor %}{% endfor %}</div>
  {% endif %}

  <label class="block mb-3">
    <span class="block mb-1">Name</span>
    <input type="text" name="name" required value="{{ form.name.value|default:'' }}"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
  </label>

  <label class="block mb-3">
    <span class="block mb-1">Email</span>
    <input type="email" name="email" required value="{{ form.email.value|default:'' }}"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
  </label>

  <label class="block mb-4">
    <span class="block mb-1">Password</span>
    <input type="password" name="password" required minlength="6"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
    <span class="text-xs text-gray-500 dark:text-gray-400">At least 6 characters with 1 digit</span>
  </label>

  <label class="block mb-4">
    <span class="block mb-1">Promo code <span class="text-xs text-gray-500 dark:text-gray-400">(optional)</span></span>
    <input type="text" name="promo_code" maxlength="32" autocomplete="off" autocapitalize="characters"
           value="{{ form.promo_code.value|default:'' }}"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 uppercase">
    <span class="text-xs text-gray-500 dark:text-gray-400">Its credits are added once you confirm your email.</span>
  </label>

  {% include 'accounts/partials/turnstile_widget.html' %}

  <button type="submit"
          class="btn group w-full inline-flex justify-center items-center rounded-lg bg-brand-primary text-gray-900 font-medium py-2 disabled:opacity-50 hover:bg-sage-400 text-sm">
    <span class="group-disabled:hidden">Create account</span>
    <span class="hidden group-disabled:flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Creating...</span>
  </button>
</form>
