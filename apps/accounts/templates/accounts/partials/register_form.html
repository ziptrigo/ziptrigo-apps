<form id="register-form"
      method="post"
      action="{% url 'accounts:register' %}"
      hx-post="{% url 'accounts:register' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}

  {% if form.errors %}
    <div class="mb-4 text-sm text-red-600" style="white-space: pre-line">
      {% for error in form.non_field_errors %}{{ error }}
{% endfor %}{% for field in form %}{% for error in field.errors %}{{ field.label }}: {{ error }}
{% endfor %}{% endfor %}</div>
  {% endif %}

  <label class="block mb-3">
    <span class="block mb-1">Name</span>
    <input type="text" name="name" required value="{{ form.name.value|default:'' }}"
           class="w-full rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sage-300">
  </label>

  <label class="block mb-3">
    <span class="block mb-1">Email</span>
    <input type="email" name="email" required value="{{ form.email.value|default:'' }}"
           class="w-full rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sage-300">
  </label>

  <label class="block mb-4">
    <span class="block mb-1">Password</span>
    <input type="password" name="password" required minlength="6"
           class="w-full rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sage-300">
    <span class="text-xs text-gray-500 dark:text-gray-400">At least 6 characters with 1 digit</span>
  </label>

  <button type="submit"
          class="group w-full inline-flex justify-center items-center rounded bg-sage-300 text-gray-900 font-medium py-2 hover:opacity-90 disabled:opacity-50">
    <span class="group-disabled:hidden">Create account</span>
    <span class="hidden group-disabled:flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Creating...</span>
  </button>
</form>
