{% load field_errors %}<form id="login-form"
      method="post"
      action="{% url 'accounts:login' %}"
      hx-post="{% url 'accounts:login' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}
  {% field_errors form %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

  {% if form.errors %}
    <div role="alert" class="mb-4 text-sm text-red-600 dark:text-red-400" style="white-space: pre-line">
      {% for error in form.non_field_errors %}{{ error }}
{% endfor %}{% for field in form %}{% for error in field.errors %}{{ field.label }}: {{ error }}
{% endfor %}{% endfor %}</div>
  {% endif %}

  <label class="block mb-3">
    <span class="block mb-1">Email</span>
    <input type="email" name="email" required autocomplete="email" autofocus value="{{ form.email.value|default:'' }}"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
  </label>

  <label class="block mb-3">
    <span class="block mb-1">Password</span>
    <div class="relative">
      <input id="password-input" type="password" name="password" required autocomplete="current-password"
             class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 pr-10">
      <button type="button" id="toggle-password"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
              aria-label="Toggle password visibility">
        <i class="fa-solid fa-eye" id="eye-icon"></i>
      </button>
    </div>
  </label>

  <button type="submit"
          class="btn group w-full inline-flex justify-center items-center rounded-lg bg-brand-primary text-gray-900 font-medium py-2 disabled:opacity-50 hover:bg-sage-400 text-sm">
    <span class="group-disabled:hidden">Sign in</span>
    <span class="hidden group-disabled:flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Signing in...</span>
  </button>
</form>
