<form id="profile-form"
      method="post"
      action="{% url 'accounts:profile-update' %}"
      hx-post="{% url 'accounts:profile-update' %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}

  {% if saved %}
    <div class="mb-4 text-sm p-3 rounded bg-green-100 dark:bg-green-900 text-green-800 dark:text-green-200 border border-green-300 dark:border-green-700">
      Profile updated successfully.
    </div>
  {% endif %}
  {% if form.errors %}
    <div class="mb-4 text-sm p-3 rounded bg-red-100 dark:bg-red-900 text-red-800 dark:text-red-200 border border-red-300 dark:border-red-700">
      {% for field in form %}{% for error in field.errors %}{{ error }}<br>{% endfor %}{% endfor %}
    </div>
  {% endif %}

  <!-- Email (read-only / username) -->
  <label class="block mb-4">
    <span class="block mb-1 text-sm font-medium">Email</span>
    <input type="text"
           value="{{ request.user.email }}"
           disabled
           class="w-full rounded border border-gray-300 dark:border-gray-600 bg-gray-100 dark:bg-gray-700 px-3 py-2 text-gray-500 dark:text-gray-400 cursor-not-allowed">
    <span class="text-xs text-gray-500 dark:text-gray-400 mt-1 block">Email cannot be changed</span>
  </label>

  <!-- Name -->
  <label class="block mb-4">
    <span class="block mb-1 text-sm font-medium">Name</span>
    <input type="text"
           name="name"
           id="profile-name"
           value="{{ form.name.value|default:'' }}"
           required
           maxlength="255"
           class="w-full rounded border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sage-300">
  </label>

  <button type="submit"
          class="group inline-flex justify-center items-center rounded bg-sage-300 text-gray-900 font-medium px-4 py-2 hover:opacity-90 disabled:opacity-50 disabled:cursor-not-allowed">
    <span class="group-disabled:hidden">Save Profile</span>
    <span class="hidden group-disabled:flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Saving...</span>
  </button>
</form>
