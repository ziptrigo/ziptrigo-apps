{% load field_errors %}<form id="reset-password-form"
      method="post"
      action="{% url 'accounts:reset-password' token %}"
      hx-post="{% url 'accounts:reset-password' token %}"
      hx-target="this"
      hx-swap="outerHTML"
      hx-disabled-elt="find button[type='submit']">
  {% csrf_token %}
  {% field_errors form %}

  {% if form.errors %}
    <div class="mb-4 text-sm text-red-600" style="white-space: pre-line">
      {% for error in form.non_field_errors %}{{ error }}
{% endfor %}{% for field in form %}{% for error in field.errors %}{{ field.label }}: {{ error }}
{% endfor %}{% endfor %}</div>
  {% endif %}

  <label class="block mb-3">
    <span class="block mb-1">New password</span>
    <input type="password" name="password" required minlength="6"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
  </label>

  <label class="block mb-3">
    <span class="block mb-1">Confirm password</span>
    <input type="password" name="password_confirm" required minlength="6"
           class="w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-800 px-3 py-2">
  </label>

  <button type="submit"
          class="btn group w-full inline-flex justify-center items-center rounded-lg bg-brand-primary text-gray-900 font-medium py-2 disabled:opacity-50 hover:bg-sage-400 text-sm">
    <span class="group-disabled:hidden">Save new password</span>
    <span class="hidden group-disabled:flex items-center"><i class="fas fa-spinner fa-spin mr-2"></i>Saving...</span>
  </button>
</form>
