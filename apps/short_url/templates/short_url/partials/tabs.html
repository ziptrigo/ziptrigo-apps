{# Status tabs with counts. Sent again, out of band, with every list refresh. #}
<div id="link-tabs"{% if oob %} hx-swap-oob="true"{% endif %}
     class="mb-4 border-b border-gray-200 dark:border-gray-700">
    <nav data-tabs aria-label="Link status" class="-mb-px flex flex-wrap gap-x-1">
        {% for tab in tabs %}
        <a href="{{ tab.href }}"
           hx-get="{{ tab.list_url }}" hx-target="#link-list" hx-swap="innerHTML"
           hx-sync="#link-filters:replace"
           {% if tab.active %}aria-current="page"{% endif %}
           class="inline-flex items-center border-b-2 px-3 py-2 text-sm font-medium {% if tab.active %}border-brand-primary text-gray-900 dark:text-gray-100{% else %}border-transparent text-gray-500 dark:text-gray-400 hover:border-gray-300 dark:hover:border-gray-600 hover:text-gray-700 dark:hover:text-gray-200{% endif %}">
            {{ tab.label }}
            {% if tab.count %}
            <span class="ml-1.5 rounded-full px-2 py-0.5 text-xs font-medium tabular-nums bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-300">{{ tab.count }}</span>
            {% endif %}
        </a>
        {% endfor %}
    </nav>
</div>
