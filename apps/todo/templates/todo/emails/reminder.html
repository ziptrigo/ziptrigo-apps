<div style="font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; color: #2c3432; line-height: 1.5;">
  <p style="margin: 0 0 4px; font-size: 18px; font-weight: 600;">{{ title }}</p>
  <p style="margin: 0 0 16px; color: #475a53;">{{ due }} ({{ zone }})</p>
  {% if description_html %}<div style="margin: 0 0 16px; padding: 8px 16px; border-left: 4px solid #8fa89e; background: #f4f7f6;">{{ description_html }}</div>{% endif %}
  <p><a href="{{ link }}" style="color: #3b4a47;">Open the task</a></p>
  <p style="color: #5a736a; font-size: 12px;">You get this because a reminder is set on this task. You can change reminders on the task, or turn email reminders off in your To-do settings.</p>
</div>
