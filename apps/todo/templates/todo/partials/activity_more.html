{% if more %}
<button type="button" hx-get="{% url 'todo:task-activity' task.number %}?before={{ more|urlencode }}"
        hx-target="#task-activity-list" hx-swap="beforeend" hx-disabled-elt="this"
        class="btn mt-3 inline-flex items-center px-3 py-1.5 border border-gray-300 dark:border-gray-600 text-sm font-medium rounded-lg text-gray-700 dark:text-gray-100 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700">Show more</button>
{% endif %}
