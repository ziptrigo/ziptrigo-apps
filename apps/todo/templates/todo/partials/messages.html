{# The content of a message slot after a refused action (always sent with status 422). #}
<div class="text-red-600 dark:text-red-400" role="alert">
    {% for line in messages_list %}{{ line }}<br>{% endfor %}
    {% if top_up %}<a href="{% url 'billing:credits-history' %}" class="underline">Top up your credits</a>{% endif %}
</div>
