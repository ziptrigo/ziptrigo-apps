[pytest]
# E2E tests don't use django-pytest directly because they run against a separate process
# This prevents pytest-django from trying to find a django project at the root
DJANGO_SETTINGS_MODULE =
# `--confcutdir`: the repo-root `conftest.py` builds Django model factories, which needs a configured
# Django this setup deliberately doesn't have.
addopts = -v --tb=short --confcutdir=tests_e2e
testpaths = tests_e2e
