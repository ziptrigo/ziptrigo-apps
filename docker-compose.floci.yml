# Local AWS/S3 emulation via Floci — a separate Compose file, deliberately not part of
# docker-compose.yml.
#
# Floci is an MIT-licensed, drop-in LocalStack replacement: it emulates AWS services (S3 among
# them) locally, so app code can talk to "AWS" without a real account or a real bucket. This repo
# has no code wired to it yet (see README.md) — this file just makes the emulator available for
# whenever qr_code, file_transfer or another app here starts storing things in S3.
#
# SHARED COMPOSE PROJECT — read before editing.
# The top-level `name` below is `floci`, not this repo's directory name (`ziptrigo-apps`), and on
# purpose: two sibling repos on the same dev machine — `wsa` (/Users/joao/code/wsa) and `pfo`
# (/Users/joao/code/agroserv/pfo) — already run Floci this same way, each with its own
# docker-compose.floci.yml declaring the identical `floci` service under the identical project name
# `floci`. Compose identifies a container by project name + service name, so all three repos
# address the *same* container and the *same* volume rather than each starting their own. That
# matters because Floci binds a fixed host port (127.0.0.1:4566) and persists to a named volume;
# running more than one instance at once on this machine would collide on the port and split the
# persisted data across instances. With a shared project, whichever repo runs `docker compose up`
# first starts the container, and the other two just reuse it.
#
# Two invariants keep that working:
#
#   1. The `floci` service's *values* — image digest, environment, ports, volumes, healthcheck —
#      must stay byte-identical across all three repos' copies of this file. Compose only
#      recreates a container when its `com.docker.compose.config-hash` label (computed purely from
#      the service's values, not from comments, key order or the project directory) no longer
#      matches the desired config. If one repo's copy drifts — say a Renovate bot bumps the image
#      tag here but not in wsa or pfo — the next `up` from any repo would recreate the container
#      with the drifted config, silently changing (possibly downgrading) what the other repos are
#      using. Bump the pinned image deliberately, in lockstep, across all three repos in the same
#      change:
#        docker pull floci/floci:<new-tag>
#        docker inspect --format '{{index .RepoDigests 0}}' floci/floci:<new-tag>
#      Verify all three still agree before/after with:
#        docker compose -f docker-compose.floci.yml config --hash floci     # here
#        cd /Users/joao/code/wsa && docker compose -f docker-compose.floci.yml config --hash floci
#        cd /Users/joao/code/agroserv/pfo && docker compose -f docker-compose.floci.yml config --hash floci
#      All three hex strings must match.
#
#   2. This file must declare nothing but the `floci` service (and its volume). Compose treats any
#      container in the `floci` project that isn't in the current file as an "orphan"; a
#      `--remove-orphans` run from wsa or pfo would then delete a service this file added on top of
#      `floci`, and vice versa. If this repo ever needs its own local infra alongside Floci, it
#      goes in docker-compose.yml (see the `web` service there), never in here.
#
# Consequence worth knowing: `docker compose -f docker-compose.floci.yml down` stops (and
# `down -v` deletes) the container/volume that wsa and pfo may also be relying on, since it's the
# same one.
#
# For the fuller rationale, troubleshooting and version-bump procedure, see wsa's
# docs/playbooks/backend/LOCAL_AWS.md (/Users/joao/code/wsa/docs/playbooks/backend/LOCAL_AWS.md) —
# not duplicated here since this repo doesn't consume Floci yet.
name: floci

services:
  floci:
    image: floci/floci:2.1.0@sha256:f5aa8c18302cedb4f2385f5c4e455b3efc77fee6bf7b6e5d1712b2817ba102db
    environment:
      FLOCI_DEFAULT_REGION: eu-central-1
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    ports:
      - '127.0.0.1:4566:4566'
    volumes:
      - floci:/app/data
    healthcheck:
      test: ['CMD', 'curl', '--silent', '--fail', 'http://localhost:4566/_localstack/health']
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  floci:
