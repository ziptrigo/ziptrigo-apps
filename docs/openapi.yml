    TotalsSchema:
      description: 'The numbers every link has, whatever it has paid for. `clicks` and `bot_clicks` are the

        link''s own counters (see `LinkSchema`); `uniques` sums the daily unique visitors (someone who

        returns on another day counts again), bots left out while `filter_bots` is on.'
      properties:
        clicks:
          title: Clicks
          type: integer
        bot_clicks:
          title: Bot Clicks
          type: integer
        uniques:
          title: Uniques
          type: integer
        filter_bots:
