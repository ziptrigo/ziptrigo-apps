          default: -created_at
          title: Sort
          type: string
        required: false
      - in: query
        name: limit
        schema:
          default: 20
          title: Limit
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          default: 0
          title: Offset
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkListSchema'
      description: "List the caller's links (not the deleted ones), newest first by default.\n\n- `q`: matches the code or alias, the destination, the title and the tags.\n- `tag`: only links with this tag.\n- `status`: `all` (default), `active`, `disabled`, `expired`, `capped` (past `max_clicks`) or\n  `taken_down`: the states of `LinkSchema.state`, as the dashboard's tabs.\n- `sort`: `-created_at` (default), `created_at`, `-click_count` or `click_count`.\n- `limit` (1-100, default 20) and `offset` page the result; `count` is the total."
      tags:
      - Short URLs
