          - type: 'null'
          title: Max Clicks
        password_protected:
          title: Password Protected
          type: boolean
        filter_bots:
          title: Filter Bots
          type: boolean
        click_count:
          title: Click Count
          type: integer
        bot_click_count:
          title: Bot Click Count
          type: integer
        last_clicked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Clicked At
        analytics_enabled:
          title: Analytics Enabled
          type: boolean
        takedown_reason:
          title: Takedown Reason
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
