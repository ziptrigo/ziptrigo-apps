      - position
      - source
      - email_from
      - email_from_authenticated
      - parent
      - labels
      - recurrence
      - reminders
      - blocked_by
      - has_open_blocker
      - blocks
      - subtask_count
      - open_subtask_count
      - comment_count
      - attachment_count
      - charged_credits
      - unpaid
      - created_at
      - updated_at
      title: TaskListItemSchema
      type: object
