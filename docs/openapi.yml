          - type: 'null'
      title: FilterUpdateSchema
      type: object
    TaskListItemSchema:
      description: "A task in a list (`GET /tasks`, `GET /filters/{id}/tasks`). When the list was searched\n(`q`, or a filter with search text) each task also says where the text matched:\n\n- `search_field` is `title`, `description` or `comment` (the first comment that matches), or\n  `\"\"` when no snippet could be made (the budget ran out before this row, or the engines\n  disagree at the edges; the task still matches). `null` when there was no search text.\n- `search_snippet` is **plain text** around the match (about 60 characters either side, with\n  an ellipsis `…` where the text goes on), `match_start` and `match_end` the half-open range of\n  the matched text inside it, in Unicode code points (not UTF-16 units). Searches run on\n  normalised text, so the snippet is lower-case with accents, punctuation and Markdown\n  formatting gone, and a match longer than 100 characters is cut to its first 100. All three\n  are `null` when `search_field` is `\"\"` or null."
      properties:
        id:
          format: uuid
          title: Id
          type: string
        number:
          title: Number
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        description_html:
          title: Description Html
          type: string
        priority:
          title: Priority
          type: integer
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Due Date
        due_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: Due Time
        due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due At
        closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the task was closed (as Done or as Won't do); `null` while it is open.
          title: Closed At
        state:
          anyOf:
          - enum:
            - todo
            - in_progress
            - blocked
            - on_hold
            type: string
          - type: 'null'
          description: 'What an open task is doing: `todo`, `in_progress`, `on_hold` or `blocked` (set only by blockers); `null` while the task is closed (`closed_at` is set).'
          title: State
        resolution:
          anyOf:
          - enum:
            - done
            - wont_do
            type: string
          - type: 'null'
          description: How a closed task was closed, `done` or `wont_do`; `null` while it is open.
          title: Resolution
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        position:
          title: Position
          type: integer
        source:
          title: Source
          type: string
        email_from:
          anyOf:
          - type: string
          - type: 'null'
          description: 'For a task made from an email: its From address; `null` otherwise.'
          title: Email From
        email_from_authenticated:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'For a task made from an email: whether the sender was authenticated (DMARC, DKIM or SPF); `null` otherwise.'
          title: Email From Authenticated
        parent:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent
        labels:
          items:
            $ref: '#/components/schemas/LabelRefSchema'
          title: Labels
          type: array
        recurrence:
          anyOf:
          - $ref: '#/components/schemas/RecurrenceSchema'
          - type: 'null'
        reminders:
          items:
            $ref: '#/components/schemas/ReminderSchema'
          title: Reminders
          type: array
        blocked_by:
          description: The tasks that block this one, by number (closed and trashed ones too).
          items:
            $ref: '#/components/schemas/TaskRefSchema'
          title: Blocked By
          type: array
        has_open_blocker:
          description: 'Whether any task in `blocked_by` is open (`open: true`).'
          title: Has Open Blocker
          type: boolean
        blocks:
          description: The tasks this one blocks, by number (closed and trashed ones too).
          items:
            $ref: '#/components/schemas/TaskRefSchema'
          title: Blocks
          type: array
        subtask_count:
          title: Subtask Count
          type: integer
        open_subtask_count:
          title: Open Subtask Count
          type: integer
        comment_count:
          title: Comment Count
          type: integer
        attachment_count:
          title: Attachment Count
          type: integer
        charged_credits:
          title: Charged Credits
          type: integer
        unpaid:
          title: Unpaid
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        search_field:
          anyOf:
          - enum:
            - title
            - description
            - comment
            - ''
            type: string
          - type: 'null'
          description: Where the search text matched; `null` when the list was not searched.
          title: Search Field
        search_snippet:
          anyOf:
          - type: string
          - type: 'null'
          description: Plain text around the match; `null` without one.
          title: Search Snippet
        match_start:
          anyOf:
          - type: integer
          - type: 'null'
          description: Start of the match in `search_snippet` (code points).
          title: Match Start
        match_end:
          anyOf:
          - type: integer
          - type: 'null'
          description: End (exclusive) of the match in `search_snippet`.
          title: Match End
      required:
      - id
      - number
      - title
