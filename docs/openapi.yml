        out, or `null`, is unchanged.'
      properties:
        minutes_before:
          anyOf:
          - type: integer
          - type: 'null'
          title: Minutes Before
        channel:
          anyOf:
          - type: string
          - type: 'null'
          title: Channel
      title: ReminderUpdateSchema
      type: object
    DeliveryListSchema:
      properties:
        count:
          title: Count
          type: integer
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        results:
          items:
            $ref: '#/components/schemas/DeliverySchema'
          title: Results
          type: array
      required:
