    post:
      operationId: apps_qr_code_api_qrcode_create_qrcode
      summary: Create Qrcode
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeSchema'
      description: Create a new QR code.
      tags:
