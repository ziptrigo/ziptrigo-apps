    PartUrlsResponseSchema:
      properties:
        urls:
          additionalProperties:
            type: string
          title: Urls
          type: object
      required:
      - urls
      title: PartUrlsResponseSchema
      type: object
    PartRequestSchema:
      properties:
        part_number:
          title: Part Number
          type: integer
        checksum_sha256:
          title: Checksum Sha256
          type: string
      required:
      - part_number
      - checksum_sha256
      title: PartRequestSchema
      type: object
    PartUrlsRequestSchema:
      properties:
        parts:
          items:
            $ref: '#/components/schemas/PartRequestSchema'
          title: Parts
          type: array
      required:
      - parts
      title: PartUrlsRequestSchema
      type: object
    ResumeResponseSchema:
      description: 'Response for `POST /transfers/{id}/files/{file_id}/resume/` (spec: resumable uploads --

        issue #55 phase 3). `restarted` is set when S3 no longer recognized the previous upload id (it

        was aborted, e.g. by the bucket''s lifecycle rule) and a fresh one was started transparently;

        `uploaded_parts` is then always empty.'
      properties:
        restarted:
          title: Restarted
          type: boolean
        part_size_bytes:
          title: Part Size Bytes
          type: integer
        part_count:
          title: Part Count
          type: integer
        uploaded_parts:
          items:
            $ref: '#/components/schemas/UploadedPartSchema'
          title: Uploaded Parts
          type: array
      required:
      - restarted
      - part_size_bytes
      - part_count
      - uploaded_parts
      title: ResumeResponseSchema
      type: object
    UploadedPartSchema:
      properties:
        part_number:
          title: Part Number
          type: integer
        etag:
          title: Etag
          type: string
        size:
          title: Size
          type: integer
        checksum_sha256:
          default: ''
          title: Checksum Sha256
          type: string
      required:
      - part_number
      - etag
      - size
      title: UploadedPartSchema
      type: object
    OkSchema:
      properties:
        ok:
          default: true
          title: Ok
          type: boolean
      title: OkSchema
      type: object
    CompleteFileSchema:
      properties:
        parts:
          items:
            $ref: '#/components/schemas/CompletedPartSchema'
          title: Parts
          type: array
      required:
      - parts
      title: CompleteFileSchema
      type: object
    CompletedPartSchema:
      properties:
        part_number:
          title: Part Number
          type: integer
        etag:
          title: Etag
          type: string
        checksum_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Checksum Sha256
      required:
      - part_number
      - etag
      title: CompletedPartSchema
      type: object
    RecipientSchema:
      description: 'One recipient on a sent transfer -- enough for a client (the CLI''s `resend`) to resend that

        recipient''s email without needing a separate lookup endpoint just to learn their id.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        email:
          title: Email
          type: string
        last_sent_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Sent At
      required:
      - id
      - email
      - last_sent_at
      title: RecipientSchema
      type: object
    TransferFileSchema:
      description: 'One file on a transfer -- enough for a client (the CLI''s `send --draft-id` resume, or

        `filetransfer show`) to tell which of its local files are already uploaded, and by how much,

        without a separate endpoint.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        size:
          title: Size
          type: integer
        uploaded:
          title: Uploaded
          type: boolean
        client_last_modified:
          anyOf:
          - type: integer
          - type: 'null'
          title: Client Last Modified
      required:
      - id
      - name
      - size
      - uploaded
      title: TransferFileSchema
      type: object
    TransferSchema:
      description: 'One transfer, as returned by every read/write endpoint below. Mirrors the fields the

        dashboard shows (spec section 6), never the password itself.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        status:
          title: Status
          type: string
        display_name:
          title: Display Name
          type: string
        message:
          title: Message
          type: string
        recipients:
          items:
            $ref: '#/components/schemas/RecipientSchema'
          title: Recipients
          type: array
        files:
          items:
            $ref: '#/components/schemas/TransferFileSchema'
          title: Files
          type: array
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Expires At
        max_downloads:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Downloads
        downloads_remaining:
          anyOf:
          - type: integer
          - type: 'null'
          title: Downloads Remaining
        download_count:
          title: Download Count
          type: integer
        has_password:
          title: Has Password
          type: boolean
        notify_on_download:
          title: Notify On Download
          type: boolean
        size_bytes:
          title: Size Bytes
          type: integer
        credits_charged:
          title: Credits Charged
          type: integer
        download_url:
          title: Download Url
          type: string
        created_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Created At
      required:
      - id
      - status
      - display_name
      - message
      - recipients
      - files
      - expires_at
      - max_downloads
      - downloads_remaining
      - download_count
      - has_password
      - notify_on_download
      - size_bytes
      - credits_charged
      - download_url
      - created_at
      title: TransferSchema
      type: object
    TransferListSchema:
      description: 'A page of `TransferSchema` (spec section 14: "list transfers ... pagination").'
      properties:
        count:
          title: Count
          type: integer
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        results:
          items:
            $ref: '#/components/schemas/TransferSchema'
          title: Results
          type: array
      required:
      - count
      - limit
      - offset
      - results
      title: TransferListSchema
      type: object
    TransferUpdateSchema:
      description: 'Body for `PATCH /transfers/{id}` (spec section 14: "update (disable, re-enable, expiry, max

        downloads, password, notify toggle)"). Every field is optional -- only the ones present in the

        request body are applied (`payload.dict(exclude_unset=True)` in the router), so omitting a

        field always means "leave it as it is", never "clear it". A blank `password` with

        `remove_password` unset is likewise a no-op; set `remove_password: true` to actually clear it,

        same as the dashboard''s own settings form (see `forms.dashboard_actions.PasswordActionForm`).'
      properties:
        disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Disabled
        expiry_choice:
          anyOf:
