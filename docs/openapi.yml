      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkDetailSchema'
      description: 'Enable a disabled link. An active link beyond the free allowance costs credits once per

        link (`credits_spent`; re-enabling one that already paid is free; `expected_cost` guards

        it). Idempotent: an already active link changes nothing. A link whose destination is on the

        block list can''t be enabled (403).'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/s/links/{link_id}/disable:
    post:
      operationId: apps_short_url_api_links_disable_link
      summary: Disable Link
      parameters:
      - in: path
        name: link_id
        schema:
          format: uuid
          title: Link Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkDetailSchema'
      description: 'Disable a link: it shows the neutral unavailable page until enabled again. Always free,

        and still possible while the link is under review. Idempotent.'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/s/links/{link_id}/analytics:
    post:
      operationId: apps_short_url_api_links_enable_analytics
      summary: Enable Analytics
      parameters:
      - in: path
        name: link_id
        schema:
          format: uuid
          title: Link Id
          type: string
        required: true
      - in: query
        name: expected_cost
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expected Cost
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkDetailSchema'
      description: 'Open the link''s detailed statistics (`GET /links/{id}/stats` `detail`): costs credits once

        per link (`credits_spent`; `expected_cost` guards it); free when already open. Events are

        recorded from the first click, so the history is there at once.'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/s/links/{link_id}/qr.png:
    get:
      operationId: apps_short_url_api_links_link_qr
      summary: Link Qr
      parameters:
      - in: path
        name: link_id
        schema:
          format: uuid
          title: Link Id
          type: string
        required: true
      responses:
        '200':
          description: OK
      description: 'The short link as a QR code (`image/png`), rendered on demand. Limited per user

        (`SU_QR_USER`, shared with the web page).'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/s/links/{link_id}/preview:
    get:
      operationId: apps_short_url_api_links_link_preview
      summary: Link Preview
      parameters:
      - in: path
        name: link_id
        schema:
          format: uuid
          title: Link Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewSchema'
      description: 'What the public preview page (`/s/<code>+`) shows, for your own link: the destination and

        its host, the title and when it was made, whether it is password protected and whether it

        redirects right now (`available`).'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/s/links/{link_id}/stats:
    get:
      operationId: apps_short_url_api_stats_link_stats
      summary: Link Stats
      parameters:
      - in: path
        name: link_id
        schema:
          format: uuid
          title: Link Id
          type: string
        required: true
      - in: query
        name: range
        schema:
          default: '30'
          title: Range
          type: string
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsSchema'
      description: 'A link''s statistics. `range` (`7`, `30` (default), `90` or `all`, in days back from today,

        UTC) applies to `detail`; `totals` is always all time.


        The totals are free. `detail` (time series and top lists) is the paid "detailed analytics"

        extra, once per link: until `POST /links/{id}/analytics` opens it, `detail` is `null` and

        `analytics_cost` says what it costs. The figures follow the link''s current `filter_bots` (bots

        left out, or added to the clicks, visitors and lists), from the rollups plus today''s events.'
      tags:
      - Short URLs
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/activity:
    get:
      operationId: apps_todo_api_activity_task_activity
      summary: Task Activity
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: query
        name: limit
        schema:
          default: 20
          title: Limit
          type: integer
        required: false
      - in: query
        name: before
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Before
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPageSchema'
      description: 'The task''s activity log, **newest first**, also for a task in the Trash (another user''s task

        is a 404).


        `limit` (1-100, default 20) is the page size. `next` in the answer is the cursor of the next,

        older page: send it as `before` to continue (`null` on the last page); the cursor is the time

        and id of the last entry, so entries written while paging never repeat or skip one. It is

        URL-safe (base64url, `A-Z a-z 0-9 - _` only): put it in the query string as it is. A malformed

        `before` is a 400 `before: Not a valid cursor.`. Each entry''s `text` is a sentence in the public wording (English, dates like

        `Nov 5, 2026, 3:00 PM`, whatever the account''s date and time format); see `ActivityEventSchema`

        for `kind` and `data`.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/attachments:
    post:
      operationId: apps_todo_api_attachments_start_upload
      summary: Start Upload
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTicketSchema'
      description: 'Start attaching one file to an open task. 402 while storage is paused; 400 for an empty or

        too large file (`max_attachment_bytes`, 50 MB by default), a task that already has its

        `max_attachments_per_task` (20), a malformed checksum, or a task in the Trash or completed.

        With `for_comment: true` the file is a draft for a comment: a completed task takes it (a task

        in the Trash still does not), and it counts toward the same per-task limit.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadStartSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/attachments/{attachment_id}/complete:
    post:
      operationId: apps_todo_api_attachments_complete_upload
      summary: Complete Upload
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: attachment_id
        schema:
          format: uuid
          title: Attachment Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentSchema'
      description: 'Finish an upload after the `PUT`. Idempotent. 400 if the object isn''t there yet or can''t be

        read back (try again), or if it was rejected (wrong size or checksum: the upload is discarded);

        404 if the upload no longer exists.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/attachments/{attachment_id}/url:
    get:
      operationId: apps_todo_api_attachments_attachment_url
      summary: Attachment Url
      parameters:
      - in: path
        name: attachment_id
        schema:
          format: uuid
          title: Attachment Id
          type: string
        required: true
      - in: query
        name: disposition
        schema:
          default: attachment
          title: Disposition
          type: string
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUrlSchema'
      description: 'A short-lived presigned URL for the file. `disposition=attachment` (the default) downloads

        it; `inline` is for showing it in a browser and is honoured only for a PDF or an image (by what

        the bytes are, never the name), otherwise the answer says `attachment`. 402 while storage is

        paused. Never cache the URL; ask again.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/attachments/{attachment_id}/cancel:
    post:
      operationId: apps_todo_api_attachments_cancel_upload
      summary: Cancel Upload
      parameters:
      - in: path
        name: attachment_id
        schema:
          format: uuid
          title: Attachment Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: 'Give up on an upload that was started and not completed: its row (so it stops counting

        toward the task''s file cap) and its object, if the `PUT` landed. Idempotent: an upload that is

        already gone (cancelled, abandoned, its task deleted, or never yours) answers 204 too, and

        removes only an object under your own prefix. A file that is already attached is a 400: remove

        it with `DELETE /attachments/{id}`. Spends `TODO_EDIT_USER`, after the 400.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/attachments/{attachment_id}/discard:
    post:
      operationId: apps_todo_api_attachments_discard_attachment
      summary: Discard Attachment
      parameters:
      - in: path
        name: attachment_id
        schema:
          format: uuid
          title: Attachment Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: 'Delete a comment file that was uploaded as a draft (`for_comment`) and not saved with a

        comment (the user took it out of the comment they were writing): the object and the row, and

        its bytes stop being billed. Idempotent: 204 for one that is already gone (or never yours,

        spending nothing). A file that is attached to a task or to a comment, or is not a comment

        file, is a 400: remove it with `DELETE /attachments/{id}` (or edit the comment). 503 when the

        object could not be deleted (try again). Spends `TODO_EDIT_USER`, after the 400.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/attachments/{attachment_id}:
    delete:
      operationId: apps_todo_api_attachments_delete_attachment
      summary: Delete Attachment
      parameters:
      - in: path
        name: attachment_id
        schema:
          format: uuid
          title: Attachment Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: 'Remove a file from its task: the object and the row, and its bytes stop being billed. Also

        allowed for a task in the Trash and while storage is paused (it saves money). On an upload

        that was started and not completed it is the same as `POST /attachments/{id}/cancel`.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/blockers:
    post:
      operationId: apps_todo_api_blockers_add_blocker
      summary: Add Blocker
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Make the task numbered `number` (in the body) block this one, and answer this task.


        Both tasks are the caller''s own and out of the Trash (a 400 `number: There is no task #N.` for

        a number that doesn''t exist **or isn''t the caller''s**; `number: #N is in the trash. Restore it

        first.`). A 400 too, keyed `number` as well, when a task is its own blocker, when the link

        would close a cycle (`number: #1200 is already blocked by #1234, directly or through other

        tasks.`) and when this task already has 20 blockers. Adding a link that already exists changes nothing. An open task given an open

        blocker becomes `blocked`, from any open state; a closed blocker, or a closed task, only links.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockerSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/blockers/suggest:
    get:
      operationId: apps_todo_api_blockers_suggest_blockers
      summary: Suggest Blockers
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: query
        name: q
        schema:
          default: ''
          maxLength: 200
          title: Q
          type: string
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/BlockerSuggestionSchema'
                title: Response
                type: array
      description: 'Open tasks that could be offered as blockers of this one (what the website''s "Blocked by"

        box suggests): up to 10 of the caller''s own open tasks, in number order, that `add` would

        accept -- not this task, not one that already blocks it and not one it blocks, directly or

        through other tasks (that would be a cycle). `q` narrows them: digits (with or without `#`)

        match the start of the number, anything else the words of the title (ignoring case and

        accents); empty lists the first open tasks. A task in the Trash, or one that already has 20 blockers, gets an empty list

        (`add` would refuse them all).


        Spends `TODO_BLOCKER_SUGGEST_USER`, a loose per-user limit; **over it the answer is an empty

        list**, never an error, so a typing box just shows nothing.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/blockers/{blocker_number}:
    delete:
      operationId: apps_todo_api_blockers_remove_blocker
      summary: Remove Blocker
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: blocker_number
        schema:
          title: Blocker Number
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: 'Take the task numbered `blocker_number` off this task''s blockers. Idempotent: 204 whether or

        not the link was there (also for a number that doesn''t exist or isn''t the caller''s, so a number

        can''t be probed), spending nothing when there was nothing to remove. A task left with no open

        blocker that was `blocked` goes back to `todo`. A 400 for a task in the Trash.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/comments:
    get:
      operationId: apps_todo_api_comments_list_comments
      summary: List Comments
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: query
        name: include_deleted_bodies
        schema:
          default: false
          title: Include Deleted Bodies
          type: boolean
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CommentSchema'
                title: Response
                type: array
      description: 'The task''s comments, oldest first. A deleted comment is listed with `deleted_at` and no

        body (`null`) unless `include_deleted_bodies=1` asks for its text too. A task in the Trash

        still shows its comments.'
      tags:
      - To-do
      security:
      - JWTAuth: []
    post:
      operationId: apps_todo_api_comments_add_comment
      summary: Add Comment
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentSchema'
      description: 'Add a Markdown comment (1 to 10,000 characters). `#1234` and task URLs in it link to tasks,

        and the tasks mentioned list this one under "referenced by". A task in the Trash takes none

        (400). `attachment_ids` attach comment files uploaded before (see `UploadStartSchema`): all or

        none, a 400 keyed `attachment_ids` if one is not an uploaded, unattached comment file of this

        task. A refused body or file list spends no budget.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentBodySchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/comments/{comment_id}:
    patch:
      operationId: apps_todo_api_comments_edit_comment
      summary: Edit Comment
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: comment_id
        schema:
          format: uuid
          title: Comment Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentSchema'
      description: 'Replace a comment''s text. The text it replaces is kept in its history

        (`.../history`); the same text changes nothing; a deleted comment cannot be edited (400).

        `attachment_ids` add uploaded comment files (all or none, as when adding) and

        `remove_attachment_ids` delete files of this comment; changing only the files leaves no

        revision. A refused body or file list spends no budget.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentEditSchema'
        required: true
      security:
      - JWTAuth: []
    delete:
      operationId: apps_todo_api_comments_delete_comment
      summary: Delete Comment
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: comment_id
        schema:
          format: uuid
          title: Comment Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: 'Delete a comment. It is only hidden: its text and history stay, and `restore` brings it

        back. Idempotent.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/comments/{comment_id}/restore:
    post:
      operationId: apps_todo_api_comments_restore_comment
      summary: Restore Comment
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: comment_id
        schema:
          format: uuid
          title: Comment Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentSchema'
      description: Bring a deleted comment back. Idempotent.
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/comments/{comment_id}/history:
    get:
      operationId: apps_todo_api_comments_comment_history
      summary: Comment History
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      - in: path
        name: comment_id
        schema:
          format: uuid
          title: Comment Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RevisionSchema'
                title: Response
                type: array
      description: 'The earlier texts of a comment, oldest first, each with when it was replaced. Works for a

        deleted comment too.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/filters:
    get:
      operationId: apps_todo_api_filters_list_filters
      summary: List Filters
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FilterSchema'
                title: Response
                type: array
      description: 'The caller''s saved filters in order. A label deleted since a filter was saved is dropped

        from its `params`.'
      tags:
      - To-do
      security:
      - JWTAuth: []
    post:
      operationId: apps_todo_api_filters_create_filter
      summary: Create Filter
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSchema'
      description: 'Save a search under a name (unique, ignoring case; at most 50 filters). A search text that

        can''t run (empty after cleaning, too long, an invalid pattern) is a 400, before the edit budget

        is spent.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterCreateSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/filters/counts:
    get:
      operationId: apps_todo_api_filters_filter_open_counts
      summary: Filter Open Counts
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties:
                  anyOf:
                  - type: integer
                  - type: 'null'
                title: Response
                type: object
      description: 'How many open tasks each of the caller''s saved filters selects, as `{filter id: count}`, for

        all of them in **one** query and one hit of the `TODO_SEARCH_USER` budget (what the website''s

        sidebar fetches). A count is `null` when the filter''s search can''t be run (an invalid

        pattern); when the query takes too long, or the budget is spent, **every** count is `null`:

        never an error. A user with no filters gets `{}` and spends nothing.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/filters/reorder:
    post:
      operationId: apps_todo_api_filters_reorder_filters
      summary: Reorder Filters
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FilterSchema'
                title: Response
                type: array
      description: 'Put the saved filters in the order given (ids that aren''t yours are ignored; at most 50, a

        longer list is a 422).'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterOrderSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/filters/{filter_id}:
    patch:
      operationId: apps_todo_api_filters_update_filter
      summary: Update Filter
      parameters:
      - in: path
        name: filter_id
        schema:
          format: uuid
          title: Filter Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterSchema'
      description: 'Rename a filter and/or replace its search (`params`, as a whole: criteria left out take

        their defaults, as on the website). Both are saved, or neither. Neither can be cleared: an explicit `null` is a 400 (to search for everything, send

        the default `params`). A body with nothing in it changes nothing and spends no budget; a value

        that can''t be used is refused before the edit budget is spent.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterUpdateSchema'
        required: true
      security:
      - JWTAuth: []
    delete:
      operationId: apps_todo_api_filters_delete_filter
      summary: Delete Filter
      parameters:
      - in: path
        name: filter_id
        schema:
          format: uuid
          title: Filter Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/filters/{filter_id}/tasks:
    get:
      operationId: apps_todo_api_filters_run_filter
      summary: Run Filter
      parameters:
      - in: path
        name: filter_id
        schema:
          format: uuid
          title: Filter Id
          type: string
        required: true
      - in: query
        name: limit
        schema:
          default: 50
          title: Limit
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          default: 0
          title: Offset
          type: integer
        required: false
      responses:
        '200':
