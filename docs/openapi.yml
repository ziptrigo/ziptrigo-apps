  /api/todo/tasks/{number}:
    get:
      operationId: apps_todo_api_tasks_get_task
      summary: Get Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetailSchema'
      description: 'One task, also one in the Trash, with its uploaded attachments and the tasks that mention

        it.'
      tags:
      - To-do
      security:
      - JWTAuth: []
    patch:
      operationId: apps_todo_api_tasks_update_task
      summary: Update Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Edit a task. Only the fields present in the body are applied, all or none (a refusal

        changes nothing); an explicit `null` clears a field (see `TaskUpdateSchema`). A task in the

        Trash is a 400: restore it first. Changing `rrule` or `recurrence_mode` edits the repeat rule

        (an empty `rrule` stops repeating), and a new `due_date` moves the task''s reminders.


        `state` sets an open task''s state (`todo`, `in_progress` or `on_hold`) and `blocked_by`

        replaces the set of tasks that block it (see `TaskUpdateSchema`). **Sent together**, the links

        are written first and then the task is `blocked` if any of its blockers is open (whatever

        `state` says), else it gets `state`. Sent alone, `state` keeps the links. A `state` equal to the

        task''s current one is a no-op (so a client may send back the state it read, `blocked`

        included; `blocked` as a change is a 400), and a request that changes nothing -- the same

        `blocked_by`, the same `state`, no other field -- spends no budget.


        The fields are checked before `TODO_EDIT_USER` is spent, so a bad value costs nothing. What

        only the locked write can decide (the task was trashed or closed meanwhile, a task with

        subtasks moved under a parent, a subtask given a repeat rule, a link another request made first

        that now closes a cycle) is refused after it was spent.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateSchema'
        required: true
      security:
      - JWTAuth: []
    delete:
      operationId: apps_todo_api_tasks_trash_task
      summary: Trash Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: 'Move a task, and its subtasks, to the Trash (restorable until `trash_days` have passed).

        Idempotent: a task already in the Trash stays there. Nothing is refunded.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/close:
    post:
      operationId: apps_todo_api_tasks_close_task
      summary: Close Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      description: 'Close a task as Done (the default) or as Won''t do (`resolution`), and deal with its open

        subtasks (`subtasks`: closed as Done by default, closed as Won''t do, or left open). Every field is

        optional, so `{}` closes the task and its open subtasks as Done. Closing a

        repeating task creates its next occurrence **whichever the resolution** (Won''t do means "skip

        this one"); one the balance can''t cover is created unpaid, see `POST /tasks`. A closed task

        has no state: it goes back to `todo` and is `blocked` again only if it is reopened while a

        blocker is open. What the task blocks is freed when this was its last open blocker.


        `note` (only with `resolution=wont_do`, else a 400) is added as a comment: it spends

        `TODO_COMMENT_USER` as well as `TODO_EDIT_USER`.


        The API closes without asking about open blockers or subtasks that have some: the links are

        kept. A task that is **already closed** is a **409** `{"detail": "This task is already closed

        as Done."}` (or `... as Won''t do.`): nothing is written, no note is added and no budget is

        spent; to change how it was closed use `POST /tasks/{number}/resolution`. A task in the Trash

        is a 400.


        Everything is checked before the budgets are spent, so a refusal costs nothing.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/reopen:
    post:
      operationId: apps_todo_api_tasks_reopen_task
      summary: Reopen Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Make a closed task open again, whichever way it was closed: `blocked` when one of its

        blockers is still open, else `todo`; its resolution is cleared. The next occurrence of a

        repeating task, if one was created, stays; the open tasks it blocks are told it is back and

        keep their state. Reopening an open task changes nothing and spends nothing (the answer is the

        task). A task in the Trash is a 400.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/resolution:
    post:
      operationId: apps_todo_api_tasks_set_resolution
      summary: Set Resolution
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Change how a **closed** task was closed (`done` or `wont_do`). It creates no occurrence,

        touches no subtasks and keeps the time the task was closed at. A 400 for an open task (it has

        no resolution; close it instead) and for a task in the Trash. Setting the resolution the task

        already has changes nothing and spends nothing (the answer is the task).'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/state:
    post:
      operationId: apps_todo_api_tasks_set_state
      summary: Set State
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Set an open task''s state: `todo`, `in_progress` or `on_hold`. Each task has its own state:

        nothing propagates between a parent and its subtasks. A 400 for `blocked` (only blockers set

        it; a Blocked task can still be given any of the three, which keeps its links), for a closed

        task (reopen it first) and for a task in the Trash. Leaving On hold or Blocked delivers one

        reminder for what was missed while it was muted. Setting the state the task already has changes

        nothing and spends nothing (the answer is the task).'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StateSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/restore:
    post:
      operationId: apps_todo_api_tasks_restore_task
      summary: Restore Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Take a task out of the Trash, with the subtasks trashed along with it. A 400 while its

        parent is still in the Trash. Idempotent.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/delete-forever:
    post:
      operationId: apps_todo_api_tasks_delete_forever
      summary: Delete Forever
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '204':
          description: No Content
      description: 'Delete a task from the Trash for good, with its subtasks, comments and files. A 404 for a

        task that isn''t in the Trash; a 400 for one whose price is still owed (a top-up settles it

        first).'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/postpone:
    post:
      operationId: apps_todo_api_tasks_postpone_task
      summary: Postpone Task
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Move the due date: `tomorrow`, `next_week` (the next Monday), `next_weekend` (the next

        Saturday) or `date` with `date` (today or later), keeping the time. Postponing one occurrence

        never moves the schedule of a repeating task.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostponeSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/checklist:
    post:
      operationId: apps_todo_api_tasks_toggle_checklist
      summary: Toggle Checklist
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Tick or untick a checklist item of the description (`- [ ] item`), counted from 0; the box

        is written back to the text.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistSchema'
        required: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/recurrence/stop:
    post:
      operationId: apps_todo_api_tasks_stop_recurrence
      summary: Stop Recurrence
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSchema'
      description: 'Stop repeating: the rule ends and the task stays. Idempotent.'
      tags:
      - To-do
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/complete:
    post:
      operationId: apps_todo_api_tasks_complete_removed
      summary: Removed
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      description: '**Removed in version 2.0.0** of the API: always a 410. Use `POST /tasks/{number}/close`.

        Spends nothing and does nothing.'
      tags:
      - To-do
      deprecated: true
      security:
      - JWTAuth: []
  /api/todo/tasks/{number}/uncomplete:
    post:
      operationId: apps_todo_api_tasks_uncomplete_removed
      summary: Removed
      parameters:
      - in: path
        name: number
        schema:
          title: Number
          type: integer
        required: true
      responses:
        '410':
          description: Gone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSchema'
      description: '**Removed in version 2.0.0** of the API: always a 410. Use `POST /tasks/{number}/reopen`.

        Spends nothing and does nothing.'
      tags:
      - To-do
      deprecated: true
      security:
      - JWTAuth: []
components:
  schemas:
    AccountSchema:
      description: The current user's account, as `GET /api/account` returns it.
