    StateSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/state`: the open task''s new state, `todo`, `in_progress` or

        `on_hold`. `blocked` is refused with a 400: only blockers set it.'
      properties:
        state:
          description: '`todo`, `in_progress` or `on_hold`.'
          enum:
          - todo
          - in_progress
          - on_hold
          title: State
          type: string
      required:
      - state
      title: StateSchema
      type: object
    PostponeSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/postpone`: `preset` `tomorrow`, `next_week`, `next_weekend`

        or `date` (with `date`, today or later).'
      properties:
        preset:
          title: Preset
          type: string
        date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date
      required:
      - preset
      title: PostponeSchema
      type: object
    ChecklistSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/checklist`: tick or untick the `index`th checklist item

        (counted from 0) of the description.'
      properties:
        index:
          title: Index
          type: integer
        checked:
          title: Checked
          type: boolean
      required:
      - index
      - checked
      title: ChecklistSchema
      type: object
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
    AdminAuth:
      type: http
      scheme: bearer
    AsyncJWTAuth:
      type: http
      scheme: bearer
servers: []
tags:
- name: Authentication
  description: Sign in for a JWT, refresh it, and the password reset and email confirmation flows. Accounts are created only on the website.
- name: Account
  description: 'The signed-in user: name, email, time zone, date and time format.'
- name: Credits
  description: 'Staff only: a user''s credit balance and adjustments.'
- name: QR Codes
  description: 'QR codes, tracked or not: create, edit, preview, images.'
- name: File Transfer
  description: 'Send files: drafts, resumable uploads to S3, recipients, the transfers you sent.'
- name: Receipts
  description: 'Receipts and invoices: uploads, the fields read from them, vendors, categories, the CSV export and the inbox address.'
- name: Short URLs
  description: Short links with editable destinations, their paid extras and click statistics.
- name: To-do
  description: 'Tasks and subtasks with states (to do, in progress, on hold, blocked), resolutions (done, won''t do) and blockers, labels, comments, reminders, attachments, saved filters, settings and each task''s activity log. A task is addressed by its number, everything else by its id. Errors are `{"detail": ...}`: 400 a value refused (a service message, or a bad query parameter), 402 not enough credits or storage unpaid, 404 not yours or not there (never 403), 409 a conflict (creation blocked by an unpaid repeating task: also `unpaid_task_numbers`), 422 a malformed request, 429 rate limited (see `Retry-After`).'
