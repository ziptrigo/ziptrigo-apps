      - AsyncJWTAuth: []
  /api/qr/{qr_id}:
    get:
      operationId: apps_qr_code_api_qrcode_retrieve_qrcode
      summary: Retrieve Qrcode
      parameters:
      - in: path
        name: qr_id
        schema:
          format: uuid
          title: Qr Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeSchema'
      description: Get details of a specific QR code.
      tags:
      - QR Codes
      security:
      - AsyncJWTAuth: []
    put:
      operationId: apps_qr_code_api_qrcode_update_qrcode
      summary: Update Qrcode
      parameters:
      - in: path
        name: qr_id
        schema:
          format: uuid
          title: Qr Id
          type: string
