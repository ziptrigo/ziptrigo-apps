    CommentAttachmentSchema:
      description: 'A file attached to a comment. `inline` says whether it may be shown in a browser (a PDF or

        an image, by what the bytes are: `inline_type` is the sniffed type, empty otherwise);

        download it with `GET /attachments/{id}/url`.'
      properties:
        id:
          description: The attachment id (`GET /attachments/{id}/url`).
          format: uuid
          title: Id
          type: string
        filename:
          description: The file name as uploaded (cleaned).
          title: Filename
          type: string
        size_bytes:
          description: The size in bytes.
          title: Size Bytes
          type: integer
        inline_type:
          description: The type sniffed from the bytes when a browser may show the file inline (PDF, JPEG, PNG, GIF, WebP), else empty.
          title: Inline Type
          type: string
        inline:
          description: Whether `GET /attachments/{id}/url?disposition=inline` works.
          title: Inline
          type: boolean
      required:
      - id
      - filename
      - size_bytes
      - inline_type
      - inline
      title: CommentAttachmentSchema
      type: object
    CommentSchema:
      description: 'A comment. `body` is the Markdown and `body_html` the rendered, sanitised HTML (`#1234` and

        task URLs linked). A deleted comment has `deleted_at` set and **no body** (`null`) unless

        `?include_deleted_bodies=1` asked for it. `edited_at` is `null` until the first edit and

        `revision_count` counts the edits. `attachments` are the comment''s files (a deleted comment

        lists none unless `?include_deleted_bodies=1` asked for it).'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        task:
          title: Task
          type: integer
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
        body_html:
          anyOf:
          - type: string
          - type: 'null'
          title: Body Html
        created_at:
          format: date-time
          title: Created At
          type: string
        edited_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Edited At
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        revision_count:
          title: Revision Count
          type: integer
        attachments:
          description: The comment's files, oldest first.
          items:
            $ref: '#/components/schemas/CommentAttachmentSchema'
          title: Attachments
          type: array
      required:
      - id
