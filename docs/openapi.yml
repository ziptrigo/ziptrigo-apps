      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeSchema'
      description: Update QR code (name only).
      tags:
      - QR Codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeUpdateSchema'
        required: true
      security:
      - AsyncJWTAuth: []
    patch:
      operationId: apps_qr_code_api_qrcode_partial_update_qrcode
      summary: Partial Update Qrcode
      parameters:
      - in: path
        name: qr_id
        schema:
          format: uuid
          title: Qr Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeSchema'
      description: Partially update QR code (name only).
      tags:
      - QR Codes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRCodeUpdateSchema'
        required: true
      security:
      - AsyncJWTAuth: []
    delete:
      operationId: apps_qr_code_api_qrcode_delete_qrcode
      summary: Delete Qrcode
      parameters:
      - in: path
        name: qr_id
        schema:
          format: uuid
          title: Qr Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: Soft delete a QR code.
      tags:
      - QR Codes
      security:
      - AsyncJWTAuth: []
  /api/qr/{qr_id}/image:
    get:
      operationId: apps_qr_code_api_qrcode_qrcode_image
      summary: Qrcode Image
      parameters:
      - in: path
        name: qr_id
