      type: object
    QRCodeUpdateSchema:
      description: Schema for updating QR codes (name only).
      properties:
        name:
          default: Untitled QR Code
          description: Name of the QR code
          maxLength: 255
          title: Name
          type: string
      title: QRCodeUpdateSchema
      type: object
    QRCodePreviewSchema:
      description: Schema for QR code preview response.
      properties:
        image_url:
          title: Image Url
          type: string
      required:
