            type: string
          - type: 'null'
          title: Email
        current_password:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Password
        timezone:
          anyOf:
          - type: string
          - type: 'null'
          title: Timezone
        date_format:
          anyOf:
          - enum:
            - mdy
            - dmy
            type: string
          - type: 'null'
          title: Date Format
        time_format:
          anyOf:
          - enum:
            - 12h
            - 24h
            type: string
          - type: 'null'
          title: Time Format
      title: AccountUpdateRequest
      type: object
    EmailConfirmRequest:
      properties:
        token:
          title: Token
          type: string
