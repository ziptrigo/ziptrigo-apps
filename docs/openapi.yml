      - body_html
      - created_at
      - edited_at
      - deleted_at
      - revision_count
      - attachments
      title: CommentSchema
      type: object
    CommentBodySchema:
      additionalProperties: false
      description: 'Body for adding a comment (1 to 10,000 characters), with the files it carries.


        `attachment_ids` are comment files already uploaded (`POST /tasks/{number}/attachments` with

        `for_comment: true`, then `complete`) for this task: all of them are attached, or the comment

        is refused with a 400 keyed `attachment_ids` (one that is not an uploaded, unattached comment

        file of this task, or is still uploading).'
      properties:
        body:
          title: Body
          type: string
        attachment_ids:
          default: []
          description: Uploaded comment files to attach (all or none).
          items:
            type: string
          maxItems: 100
          title: Attachment Ids
          type: array
      required:
      - body
      title: CommentBodySchema
      type: object
    CommentEditSchema:
      additionalProperties: false
      description: 'Body for editing a comment: the text (required: a comment still needs text; the same text

        changes nothing and leaves no revision), `attachment_ids` to add (as when adding) and

        `remove_attachment_ids`, files of this comment to delete (ids that are not its files are

        ignored). Changing only the files is not an edit of the text: no revision, no `edited_at`.'
      properties:
        body:
          title: Body
          type: string
        attachment_ids:
          default: []
          description: Uploaded comment files to attach (all or none).
          items:
            type: string
          maxItems: 100
          title: Attachment Ids
          type: array
        remove_attachment_ids:
          default: []
          description: Ids of this comment's files to delete.
          items:
            type: string
          maxItems: 100
          title: Remove Attachment Ids
          type: array
      required:
      - body
      title: CommentEditSchema
      type: object
    RevisionSchema:
      description: What a comment said before an edit replaced it, and when.
      properties:
        body:
          title: Body
          type: string
        body_html:
          title: Body Html
          type: string
        replaced_at:
          format: date-time
          title: Replaced At
          type: string
      required:
      - body
      - body_html
      - replaced_at
      title: RevisionSchema
      type: object
    FilterParamsSchema:
      additionalProperties: false
      description: 'What a saved filter selects (the same criteria as the query of `GET /tasks`, under the

        names a saved filter has always used): search text `q` in `mode` `glob` or `regex`,

        `include_closed` (closed tasks too), `resolution` (`done` or `wont_do`: which closed tasks

        `include_closed` lists; `null` for both; only with `include_closed`, else a 422), `states`

        (`todo`, `in_progress`, `blocked`, `on_hold`: an open task in any of them matches; closed tasks

        are not narrowed by it), `priorities` (0 to 3), `labels` (label ids, and `none` for tasks

        without one), a `date_range` (`any`, `overdue`, `today`, `next_7_days`, `next_30_days`,

        `no_date` or `custom` with `date_from` / `date_to`) and a `sort`. A label id that isn''t yours is

        dropped, as is one deleted later. `overdue` leaves out On hold and Blocked tasks, which are

        never overdue.


        A saved filter made on the website can carry `states` and `resolution` too; they are read and

        written here like the rest.'
      properties:
        q:
          default: ''
          title: Q
          type: string
        mode:
          default: glob
          title: Mode
          type: string
        include_closed:
          default: false
          description: List closed tasks too.
          title: Include Closed
          type: boolean
        resolution:
          anyOf:
          - enum:
            - done
            - wont_do
            type: string
          - type: 'null'
          description: Only the closed tasks closed that way; needs `include_closed`.
          title: Resolution
        states:
          default: []
          description: An open task in any of these states matches.
          items:
            enum:
            - todo
            - in_progress
            - blocked
            - on_hold
            type: string
          title: States
          type: array
        priorities:
          default: []
          items:
            type: integer
          title: Priorities
          type: array
        labels:
          default: []
          items:
            type: string
          title: Labels
          type: array
        date_range:
          default: any
          title: Date Range
          type: string
        date_from:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date From
        date_to:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Date To
        sort:
          default: date
          title: Sort
          type: string
      title: FilterParamsSchema
      type: object
    FilterSchema:
      description: 'A saved filter. `params` is what it selects (see `FilterParamsSchema`) and `summary` a short

        description of it in the public wording (`priority 1 · state on hold · @home · next 7 days`).'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        position:
          title: Position
          type: integer
        params:
          $ref: '#/components/schemas/FilterParamsSchema'
        summary:
          title: Summary
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
      required:
