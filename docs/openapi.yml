          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategorySchema'
      tags:
      - Receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryNameSchema'
        required: true
      security:
      - JWTAuth: []
  /api/receipts/categories/reorder:
    post:
      operationId: apps_receipts_api_categories_reorder_categories
      summary: Reorder Categories
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CategorySchema'
                title: Response
                type: array
      description: Put the categories in the order given; ones left out follow, in their current order.
      tags:
      - Receipts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryOrderSchema'
        required: true
      security:
      - JWTAuth: []
  /api/receipts/categories/{category_id}:
    patch:
      operationId: apps_receipts_api_categories_rename_category
      summary: Rename Category
      parameters:
      - in: path
