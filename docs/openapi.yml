        utm_medium:
          default: ''
          maxLength: 200
          title: Utm Medium
          type: string
        utm_campaign:
          default: ''
          maxLength: 200
          title: Utm Campaign
          type: string
        utm_term:
          default: ''
          maxLength: 200
          title: Utm Term
          type: string
        utm_content:
          default: ''
          maxLength: 200
          title: Utm Content
          type: string
        destination:
          default: ''
          maxLength: 4096
          title: Destination
          type: string
        title:
          default: ''
          maxLength: 1000
          title: Title
          type: string
        tags:
          items:
            type: string
          maxItems: 100
          title: Tags
          type: array
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: An ISO 8601 date-time; one without a UTC offset ("2027-12-31T18:00:00") is read in the server's time zone (settings.TIME_ZONE). A date alone ("2027-12-31") means the end of that day in that time zone. `null` means no expiry.
          title: Expires At
        max_clicks:
          anyOf:
          - type: integer
          - type: 'null'
