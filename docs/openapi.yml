      additionalProperties: false
      description: 'Body for `POST /links` and `POST /links/quote`.


        Only `destination` is required. A custom `alias` costs credits (once, at creation, and it can

        never be changed), and so does a `password`, and so does every active link beyond the free

        allowance: `POST /links/quote` says what this exact body would cost, and `expected_cost`

        makes `POST /links` refuse (409) unless it would charge exactly that. Leave `expected_cost`

        out to accept whatever it costs; the response''s `credits_spent` says what was charged.


        An unknown key is a 422 rather than ignored.'
      properties:
        utm_source:
          default: ''
          maxLength: 200
          title: Utm Source
          type: string
        utm_medium:
          default: ''
          maxLength: 200
          title: Utm Medium
          type: string
        utm_campaign:
          default: ''
          maxLength: 200
          title: Utm Campaign
          type: string
        utm_term:
          default: ''
          maxLength: 200
          title: Utm Term
          type: string
        utm_content:
          default: ''
          maxLength: 200
          title: Utm Content
          type: string
        destination:
          maxLength: 4096
          title: Destination
          type: string
        alias:
          default: ''
          maxLength: 64
          title: Alias
          type: string
        title:
          default: ''
          maxLength: 1000
          title: Title
          type: string
        tags:
          items:
            type: string
          maxItems: 100
          title: Tags
          type: array
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: An ISO 8601 date-time; one without a UTC offset ("2027-12-31T18:00:00") is read in the server's time zone (settings.TIME_ZONE). A date alone ("2027-12-31") means the end of that day in that time zone. `null` means no expiry.
          title: Expires At
        max_clicks:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Clicks
        password:
          default: ''
          maxLength: 256
          title: Password
          type: string
        filter_bots:
          default: true
          title: Filter Bots
          type: boolean
        expected_cost:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
          title: Expected Cost
      required:
