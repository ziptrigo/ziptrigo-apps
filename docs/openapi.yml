        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRecipientsSchema'
        required: true
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/recipients/{recipient_id}/resend:
    post:
      operationId: apps_file_transfer_api_transfers_resend_recipient
      summary: Resend Recipient
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      - in: path
        name: recipient_id
        schema:
          format: uuid
          title: Recipient Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
  /api/receipts/categories:
    get:
      operationId: apps_receipts_api_categories_list_categories
      summary: List Categories
      parameters: []
      responses:
