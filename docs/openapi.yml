      description: 'Body for `PATCH /labels/{id}`: only the fields present are applied. An explicit `null`

        clears the field (`description` to empty, `color` to the default colour; a `name` cannot be

        empty, so `null` there is a 400). A key that is not one of these is a 422.'
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        color:
          anyOf:
          - type: string
          - type: 'null'
          title: Color
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
      title: LabelUpdateSchema
      type: object
    ParseAnswerSchema:
      description: "The answer of `POST /parse`, in one of three shapes (only the fields of that shape are sent):\n\n- a title read: `available` and `has_date` true or false, and for a title with a date in it\n  `clean_title` (the title without those words), `due_date` (`YYYY-MM-DD` or `null`), `due_time`\n  (`HH:MM` or `null`), `rrule` and `rrule_text` (the repeat, empty for none), `matched_text`\n  (the words read) and `label` (the interpretation in words); a title with no date has\n  `has_date` false and the same fields, with the title as it is;\n- `retry` true, with `available` true and `has_date` false: the call failed or the server is\n  busy with another, try again in a minute;\n- `available` false alone: the date reader is not configured on this site."
      properties:
        available:
          title: Available
          type: boolean
        has_date:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Has Date
        retry:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Retry
        clean_title:
          anyOf:
          - type: string
          - type: 'null'
          title: Clean Title
        due_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Due Date
        due_time:
          anyOf:
          - type: string
          - type: 'null'
          title: Due Time
        rrule:
          anyOf:
          - type: string
          - type: 'null'
          title: Rrule
        rrule_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Rrule Text
        matched_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Matched Text
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
      required:
      - available
      title: ParseAnswerSchema
      type: object
    ParseSchema:
      additionalProperties: false
      description: 'Body for `POST /parse`: the title to read a date, time and repeat out of.'
      properties:
        title:
          title: Title
          type: string
      required:
      - title
      title: ParseSchema
      type: object
    ReminderCreateSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/reminders` (and an item of `reminders` when creating a

        task). `channel` defaults to the account''s default channel.'
      properties:
        minutes_before:
          title: Minutes Before
          type: integer
        channel:
          anyOf:
