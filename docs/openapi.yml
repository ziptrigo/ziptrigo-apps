      - token
      title: EmailConfirmRequest
      type: object
    ResendConfirmationRequest:
      properties:
        email:
          format: email
          title: Email
          type: string
      required:
      - email
      title: ResendConfirmationRequest
      type: object
    PasswordResetRequest:
      properties:
        email:
          format: email
          title: Email
          type: string
      required:
      - email
