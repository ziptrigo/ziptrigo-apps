          type: boolean
      required:
      - clicks
      - bot_clicks
      - uniques
      - filter_bots
      title: TotalsSchema
      type: object
    ActivityEventSchema:
      description: 'One entry of a task''s log: something that changed.


        `text` is the entry written as a sentence (`Due date changed from Nov 5, 2026, 3:00 PM to Nov 7,

        2026, 9:00 AM`; always the public wording, whatever the account''s date and time format, and in

        English). `kind` and `data` are the same entry as data, for a client that wants to write its

        own: `data` is a JSON object whose keys depend on the `kind` and which holds the values

        themselves (old and new titles, task numbers and titles, label and file names), so the entry

        still reads right after what it mentions is gone. `automatic` is true when nobody asked for the

        change in that moment (a task unblocked by a blocker closing, the next occurrence of a repeating

        task, what closing a parent does to its subtasks, a task made from an email). `channel` is the

        entry point that made the change: `web`, `api`, `email`, `push` (a phone notification''s button)

        or `system` (a job).


        The `data` of each `kind`: `created` (`source`, `parent`, `previous`, `rrule`), `state` (`from`,

        `to`), `closed` (`resolution`, `via`, `subtasks`, `subtasks_resolution`), `reopened` (`to`,

        `resolution`), `resolution` (`from`, `to`), `title` and `priority` (`from`, `to`), `due`

        (`from_date`, `from_time`, `to_date`, `to_time`), `labels` (`added`, `removed`), `repeat`

        (`from`, `to`, `mode`, `reason`), `description` (nothing), `checklist` (`checked`, `text`),

        `blocker_added` and `blocker_removed` (`number`, `title`), `blocked` (`from`, `blockers`),

        `unblocked` (`blockers` with each `reason`), `subtask_added`, `subtask_removed` and

        `subtask_closed` (`number`, `title`, ...), `moved` (`parent`), `attachment_added` and

        `attachment_removed` (`filename`, `comment`), `trashed` and `restored` (`via`).'
      properties:
        id:
          description: The entry's id.
          format: uuid
          title: Id
          type: string
        kind:
          description: What happened.
          enum:
          - created
          - state
          - closed
          - reopened
          - resolution
          - title
          - description
          - checklist
          - priority
          - due
          - labels
          - repeat
          - blocker_added
          - blocker_removed
          - blocked
          - unblocked
          - subtask_added
          - subtask_removed
          - subtask_closed
          - moved
          - attachment_added
          - attachment_removed
          - trashed
          - restored
          title: Kind
          type: string
        text:
          description: The entry as a sentence, in the public wording.
          title: Text
          type: string
        data:
          additionalProperties: true
          description: The entry as data; its keys depend on `kind`.
          title: Data
          type: object
        automatic:
          description: Nobody asked for the change in that moment.
          title: Automatic
          type: boolean
        channel:
          description: The entry point that made the change.
          enum:
          - web
          - api
          - email
          - push
          - system
          title: Channel
          type: string
        created_at:
          description: When it happened.
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - kind
      - text
      - data
      - automatic
      - channel
      - created_at
      title: ActivityEventSchema
      type: object
    ActivityPageSchema:
      description: 'A page of a task''s log, **newest first**. `next` is the cursor of the following (older)

        page, to send as `before`, or `null` on the last page. A cursor is an opaque keyset position

        (the time and id of the last entry), so entries written while paging never repeat or skip. It

        is base64url text (`A-Z a-z 0-9 - _`, no padding), safe in a query string as it is.'
      properties:
        results:
          description: The entries, newest first.
          items:
            $ref: '#/components/schemas/ActivityEventSchema'
          title: Results
          type: array
        next:
          anyOf:
          - type: string
          - type: 'null'
          description: The cursor of the next, older page (send it as `before`); `null` on the last.
          title: Next
      required:
      - results
      - next
      title: ActivityPageSchema
      type: object
    AttachmentSchema:
      description: 'An uploaded attachment. `task` is its task''s number. `inline_type` is the type sniffed from

        the bytes when a browser may show the file inline (a PDF or an image), else empty.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        task:
          title: Task
          type: integer
        filename:
          title: Filename
          type: string
        size_bytes:
          title: Size Bytes
          type: integer
        declared_type:
          title: Declared Type
          type: string
        inline_type:
          title: Inline Type
          type: string
        created_at:
          format: date-time
          title: Created At
          type: string
      required:
      - id
      - task
      - filename
      - size_bytes
      - declared_type
      - inline_type
      - created_at
      title: AttachmentSchema
      type: object
    LabelRefSchema:
      description: 'A label as a task carries it: enough to show and to filter by.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
          type: string
        color:
          title: Color
          type: string
      required:
      - id
      - name
      - color
      title: LabelRefSchema
      type: object
    RecurrenceSchema:
      description: 'The repeat rule of a task: `rrule` (an RFC 5545 `RRULE` value without the prefix),

        `rrule_text` the same in words, `mode` `fixed` or `from_completion`, `anchor_date` the date

        the current occurrence was scheduled for by the rule (postponing never moves it) and

        `ended_at` when the repeat was stopped or ran out (`null` while it is running).'
      properties:
        rrule:
          title: Rrule
          type: string
        rrule_text:
          title: Rrule Text
          type: string
        mode:
          title: Mode
          type: string
        anchor_date:
          format: date
          title: Anchor Date
          type: string
        ended_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Ended At
      required:
      - rrule
      - rrule_text
      - mode
      - anchor_date
      - ended_at
      title: RecurrenceSchema
      type: object
    ReminderSchema:
      description: 'A reminder of a task: `minutes_before` its due time, `channel` `in_app`, `email` or `both`,

        `fire_at` the instant it is due and `sent_at` when it was delivered (or swept), else `null`.

        `snoozed_until` is set while it waits for a snooze (the Snooze button of a pushed reminder):

        `fire_at` is then that instant.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        minutes_before:
          title: Minutes Before
          type: integer
        channel:
          title: Channel
          type: string
        fire_at:
          format: date-time
          title: Fire At
          type: string
        sent_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Sent At
        snoozed_until:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Snoozed Until
      required:
      - id
      - minutes_before
      - channel
      - fire_at
      - sent_at
      - snoozed_until
      title: ReminderSchema
      type: object
    TaskRefSchema:
      description: 'A task another task is linked to (`blocked_by`, `blocks`). `open` says whether it is open:

        not closed and not in the Trash, which is when it still blocks what it blocks; `trashed` says it

        is in the Trash. A link is kept when either task closes or is trashed, so closed and trashed

        tasks are listed too (`open: false`).'
      properties:
        number:
          description: The linked task's number.
          title: Number
          type: integer
        title:
          description: The linked task's title.
          title: Title
          type: string
        open:
          description: 'Not closed and not in the Trash: it still blocks what it blocks.'
          title: Open
          type: boolean
        trashed:
          description: In the Trash.
          title: Trashed
          type: boolean
      required:
      - number
      - title
      - open
      - trashed
      title: TaskRefSchema
      type: object
    TaskSchema:
      description: 'One task, as every task endpoint returns it.


        `number` is the user''s own (from 1000) and what the other endpoints take; `id` is the row''s

        UUID. `description_html` is the Markdown description rendered and sanitised, with `#1234` and

        task URLs linked. The due date and time are the owner''s local date and wall-clock time; `due_at`

        is the UTC instant they mean (a date-only task is due at the account''s default due time).

        `parent` is the parent''s number (`null` for a top-level task). `charged_credits` is what the

        task cost to create and `unpaid` says that price is still owed (see the 409 of `POST

        /tasks`). `email_from` and `email_from_authenticated` say, for a task created from an email

        (`source` is `email`), who it came from (the From address as the sender wrote it) and whether

        the mail system authenticated that sender; both are `null` for every other task.

        `subtask_count` and `open_subtask_count` count the subtasks that aren''t in the Trash,

        `comment_count` the comments that aren''t deleted and `attachment_count` the uploaded files.


        **Open and closed.** A task is open while `closed_at` is `null` and closed from the moment it is

        closed (as Done or as Won''t do), until it is reopened. `resolution` says how a closed task was

        closed (`done` or `wont_do`; a closed task with none recorded reads as `done`) and is `null` for

        an open one. `state` is what an *open* task is doing: `todo`, `in_progress`, `on_hold` (chosen

        by the owner) or `blocked` (set automatically while a task in `blocked_by` is open; nobody

        chooses it). `on_hold` and `blocked` are *muted*: such a task is never overdue and is not moved

        by `POST /tasks/reschedule-overdue`, and its reminders wait until it leaves the state. A closed

        task has no state: `state` is `null` while `closed_at` is set (reopening gives it `todo`, or

        `blocked` while a blocker is open). `has_open_blocker` is true when any task in `blocked_by` is

        open (`open: true`), whatever `state` says: an open task the owner moved to `in_progress` while

        a blocker was open still has one.


        `blocked_by` lists the tasks that block this one and `blocks` the tasks it blocks, by number

        (see `TaskRefSchema`); the links are kept when either task closes or is trashed.'
      properties:
        id:
          format: uuid
          title: Id
          type: string
        number:
          title: Number
          type: integer
        title:
          title: Title
          type: string
        description:
          title: Description
          type: string
        description_html:
          title: Description Html
          type: string
        priority:
          title: Priority
          type: integer
        due_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Due Date
        due_time:
          anyOf:
          - format: time
            type: string
          - type: 'null'
          title: Due Time
        due_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Due At
        closed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the task was closed (as Done or as Won't do); `null` while it is open.
          title: Closed At
        state:
          anyOf:
          - enum:
            - todo
            - in_progress
            - blocked
            - on_hold
            type: string
          - type: 'null'
          description: 'What an open task is doing: `todo`, `in_progress`, `on_hold` or `blocked` (set only by blockers); `null` while the task is closed (`closed_at` is set).'
          title: State
        resolution:
          anyOf:
          - enum:
            - done
            - wont_do
            type: string
          - type: 'null'
          description: How a closed task was closed, `done` or `wont_do`; `null` while it is open.
          title: Resolution
        deleted_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Deleted At
        position:
          title: Position
          type: integer
        source:
          title: Source
          type: string
        email_from:
          anyOf:
          - type: string
          - type: 'null'
          description: 'For a task made from an email: its From address; `null` otherwise.'
          title: Email From
        email_from_authenticated:
          anyOf:
          - type: boolean
          - type: 'null'
          description: 'For a task made from an email: whether the sender was authenticated (DMARC, DKIM or SPF); `null` otherwise.'
          title: Email From Authenticated
        parent:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent
        labels:
          items:
            $ref: '#/components/schemas/LabelRefSchema'
          title: Labels
          type: array
        recurrence:
          anyOf:
          - $ref: '#/components/schemas/RecurrenceSchema'
          - type: 'null'
        reminders:
          items:
            $ref: '#/components/schemas/ReminderSchema'
          title: Reminders
          type: array
        blocked_by:
          description: The tasks that block this one, by number (closed and trashed ones too).
          items:
            $ref: '#/components/schemas/TaskRefSchema'
          title: Blocked By
          type: array
        has_open_blocker:
          description: 'Whether any task in `blocked_by` is open (`open: true`).'
          title: Has Open Blocker
          type: boolean
        blocks:
          description: The tasks this one blocks, by number (closed and trashed ones too).
          items:
            $ref: '#/components/schemas/TaskRefSchema'
          title: Blocks
          type: array
        subtask_count:
          title: Subtask Count
          type: integer
        open_subtask_count:
          title: Open Subtask Count
          type: integer
        comment_count:
          title: Comment Count
          type: integer
        attachment_count:
          title: Attachment Count
          type: integer
        charged_credits:
          title: Charged Credits
          type: integer
        unpaid:
          title: Unpaid
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
      required:
      - id
      - number
      - title
      - description
      - description_html
      - priority
      - due_date
      - due_time
      - due_at
      - closed_at
      - state
      - resolution
      - deleted_at
      - position
