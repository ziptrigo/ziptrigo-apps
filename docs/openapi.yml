      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddFileSchema'
        required: true
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/files/{file_id}/parts/:
    post:
      operationId: apps_file_transfer_api_files_part_urls
      summary: Part Urls
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      - in: path
        name: file_id
        schema:
          format: uuid
          title: File Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartUrlsResponseSchema'
      description: 'Presigned PUT URLs for a batch of parts, with per-part checksums baked into the signature

        (spec section 11) -- see `services.uploads.presign_parts`''s docstring for why.'
      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartUrlsRequestSchema'
        required: true
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/files/{file_id}/resume/:
    post:
      operationId: apps_file_transfer_api_files_resume_file
      summary: Resume File
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      - in: path
        name: file_id
        schema:
          format: uuid
          title: File Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeResponseSchema'
      description: 'Resumable uploads (spec section 2, issue #55 phase 3): tell the caller which parts of this

        file''s multipart upload S3 already has, restarting the upload transparently if S3 no longer

        recognizes it (expired/aborted) -- see `apps.file_transfer.views.uploads.resume_file`, which

        this mirrors exactly, for the full reasoning.'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/files/{file_id}/complete/:
    post:
      operationId: apps_file_transfer_api_files_complete_file
      summary: Complete File
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      - in: path
        name: file_id
        schema:
          format: uuid
          title: File Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkSchema'
      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteFileSchema'
        required: true
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/files/{file_id}:
    delete:
      operationId: apps_file_transfer_api_files_remove_file
      summary: Remove File
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      - in: path
        name: file_id
        schema:
          format: uuid
          title: File Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      tags:
      - File Transfer
      security:
      - JWTAuth: []
  /api/ft/transfers/:
    post:
      operationId: apps_file_transfer_api_transfers_create_transfer
      summary: Create Transfer
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      description: 'Start a new transfer: an empty draft, exactly like visiting the web send page -- files are

        then added one at a time through the endpoints in `api/files.py`, and

        `POST /transfers/{id}/send` applies the recipients/expiry/etc. options and finalizes it,

        mirroring the web flow''s own two-step shape (upload first, options at send time).


        Reuses the caller''s existing empty draft rather than creating a fresh one on every call

        (`services.get_or_create_draft`, same as `views.send.send_page`) -- unlike the web page, this

        is a plain API call a script could retry or call in a loop, and without this, each call left

        another "Untitled transfer" draft row behind for the 24h `cleanup_drafts` grace period.

        Rate-limited on top of that for the same reason every other upload-side endpoint here is.'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
    get:
      operationId: apps_file_transfer_api_transfers_list_transfers
      summary: List Transfers
      parameters:
      - in: query
        name: filter
        schema:
          default: active
          title: Filter
          type: string
        required: false
      - in: query
        name: limit
        schema:
          default: 20
          title: Limit
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          default: 0
          title: Offset
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListSchema'
      description: 'List the caller''s transfers (spec section 14: "list transfers (filter active/ended,

        pagination)"), same active/ended split as the dashboard (`views.dashboard._transfers_for`).


        `limit`/`offset` are plain query params (not `ninja.Query(..., ge=..., le=...)`: under

        `TYPE_CHECKING` that helper is a subscriptable type alias rather than a callable, which `ty`

        -- unlike mypy, which special-cases it away -- takes at face value and flags as

        `call-non-callable`) clamped by hand instead.'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}:
    get:
      operationId: apps_file_transfer_api_transfers_get_transfer
      summary: Get Transfer
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      description: 'Get one transfer, including a still-in-progress draft -- unlike the list endpoint (which

        never shows a draft, same as the dashboard), a caller that already knows a specific id

        (typically its own, from `POST /transfers/`) needs to be able to look it up to resume an

        interrupted upload (`admin/filetransfer.py send --draft-id`).'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
    patch:
      operationId: apps_file_transfer_api_transfers_update_transfer
      summary: Update Transfer
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      description: 'Update a sent transfer (spec section 14: "update (disable, re-enable, expiry, max

        downloads, password, notify toggle)") -- every field is optional, and only the ones actually

        present in the request body are applied (see `TransferUpdateSchema`''s docstring), one dashboard

        action''s service call per field, exactly as the dashboard''s own combined settings form does

        (`views.dashboard.update_settings`).'
      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferUpdateSchema'
        required: true
      security:
      - JWTAuth: []
    delete:
      operationId: apps_file_transfer_api_transfers_delete_transfer
      summary: Delete Transfer
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      responses:
        '204':
          description: No Content
      description: 'Delete a transfer now (spec section 14). A still-in-progress draft is simply abandoned

        (`services.abort_draft`, the same cleanup `cleanup_drafts` would eventually do) rather than

        routed through `services.delete_transfer_now`, which only accepts a transfer that was actually

        sent (`Transfer.is_actionable`).'
      tags:
      - File Transfer
      security:
      - JWTAuth: []
  /api/ft/transfers/{transfer_id}/send:
    post:
      operationId: apps_file_transfer_api_transfers_finalize_transfer
      summary: Finalize Transfer
      parameters:
      - in: path
        name: transfer_id
        schema:
          format: uuid
          title: Transfer Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferSchema'
      description: 'Apply the sender''s options and send the transfer (spec section 2 and 14) -- the JWT API''s

        equivalent of the web send page''s options form submit (`views.send.send_submit`), calling the

        exact same service so the same rules (recipients, expiry, the 1-credit minimum, ...) apply.'
      tags:
      - File Transfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalizeTransferSchema'
        required: true
      security:
      - JWTAuth: []
