# Generated by `inv api generate` from the backend (config/api.py). Do not edit by hand.
# The version is config/api_version.py; see CLAUDE.md, "OpenAPI document".
openapi: 3.1.0
info:
  title: ZipTrigo API
  version: 2.2.0
  description: API for every ZipTrigo app. Authenticate with a JWT from `/api/auth/login`.
paths:
  /api/account:
    get:
      operationId: apps_accounts_routers_account_get_account
      summary: Get Account
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSchema'
      description: 'The current user''s account: id, name, email and time zone (`""` while none is set,

        which is treated as UTC).'
      tags:
      - Account
      security:
      - JWTAuth: []
    put:
      operationId: apps_accounts_routers_account_update_account
      summary: Update Account
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountUpdateResponse'
      description: 'Update current user''s account information (name, email and/or time zone).


        Requires JWT authentication; changing the email also requires `current_password`.'
      tags:
      - Account
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
        required: true
      security:
      - JWTAuth: []
  /api/auth/confirm-email:
    post:
      operationId: apps_accounts_routers_auth_confirm_email
      summary: Confirm Email
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
      description: Confirm email using a valid token.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailConfirmRequest'
        required: true
  /api/auth/resend-confirmation:
    post:
      operationId: apps_accounts_routers_auth_resend_confirmation
      summary: Resend Confirmation
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
      description: Resend email confirmation link.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendConfirmationRequest'
        required: true
  /api/auth/forgot-password:
    post:
      operationId: apps_accounts_routers_auth_forgot_password
      summary: Forgot Password
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
      description: Start password reset flow for the given email.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
  /api/auth/reset-password:
    post:
      operationId: apps_accounts_routers_auth_reset_password
      summary: Reset Password
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
      description: Reset password using a valid token.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
  /api/auth/login:
    post:
      operationId: apps_accounts_routers_auth_login
      summary: Login
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
      description: User login endpoint - returns JWT access and refresh tokens for valid credentials.
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
  /api/auth/google:
    post:
      operationId: apps_accounts_routers_auth_google_sign_in
      summary: Google Sign In
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response
                type: object
      description: 'Trade a Google ID token (from Credential Manager on Android) for our JWTs (issue #251).


        The account is found or linked by the web flow''s rules (`google_oauth.resolve_user`) but never

        created here: accounts are made in the browser. Does not fire `user_logged_in`, so claiming an

        anonymous file transfer stays a web-login thing. The token is never logged.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleTokenRequest'
        required: true
  /api/auth/refresh:
    post:
      operationId: apps_accounts_routers_auth_refresh_token
      summary: Refresh Token
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
      description: 'Token refresh endpoint - returns a new access token and a new refresh token.


        The refresh token in the request is replaced (issue #252, `services.refresh_tokens`): the

        client must keep the one in the response. The old one may be used again for a minute (two

        requests racing, at most `MAX_SUCCESSORS` times), after that it is a replay and revokes the whole

        family of tokens. Over `REFRESH_USER` it is a 429.'
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
  /api/billing/users/{user_id}/credits:
    post:
      operationId: apps_billing_api_create_credit_transaction
      summary: Create Credit Transaction
      parameters:
      - in: path
        name: user_id
        schema:
          format: uuid
          title: User Id
          type: string
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditTransactionResponse'
      description: 'Add or remove credits to/from a user account.


        Creates a credit transaction and updates the user''s credit balance atomically. Staff must

        hold `billing.add_credittransaction`, the same permission the admin''s adjustment tool needs

        (superusers hold every permission); being staff alone is not enough.'
      tags:
      - Credits
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditTransactionRequest'
        required: true
      security:
      - AdminAuth: []
    get:
      operationId: apps_billing_api_get_user_credits
      summary: Get User Credits
      parameters:
      - in: path
        name: user_id
        schema:
          format: uuid
          title: User Id
          type: string
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditsResponse'
      description: Get the current credit balance for a user.
      tags:
      - Credits
      security:
      - AdminAuth: []
  /api/qr/:
    get:
      operationId: apps_qr_code_api_qrcode_list_qrcodes
      summary: List Qrcodes
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/QRCodeSchema'
                title: Response
