          - type: 'null'
          title: Amount
        currency:
          title: Currency
          type: string
        receipt_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
          title: Receipt Date
        document_type:
          title: Document Type
          type: string
        document_number:
          title: Document Number
          type: string
        payment_method:
          title: Payment Method
          type: string
        category:
          anyOf:
          - $ref: '#/components/schemas/CategoryRefSchema'
          - type: 'null'
        notes:
          title: Notes
          type: string
        possible_duplicate_of:
          anyOf:
          - format: uuid
            type: string
          - type: 'null'
          title: Possible Duplicate Of
        duplicate_dismissed:
          title: Duplicate Dismissed
          type: boolean
        missing_fields:
          items:
            type: string
          title: Missing Fields
          type: array
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        processed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Processed At
