    CloseSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/close`. `resolution` is `done` (the default) or `wont_do`.


        `subtasks` says what happens to the open subtasks of the task being closed: `done` (the default)

        or `wont_do` closes them with that resolution, `leave` leaves them open.


        `note` (a Markdown text of up to 10,000 characters) is added to the task as a comment; it is

        allowed only with `resolution=wont_do` (a 400 otherwise), where it says why.


        A key that is not one of these is refused with a 422.'
      properties:
        resolution:
          default: done
          description: '`done` or `wont_do`.'
          enum:
          - done
          - wont_do
          title: Resolution
          type: string
        subtasks:
          default: done
          description: 'What happens to the open subtasks: closed as `done`, closed as `wont_do`, or left open (`leave`).'
          enum:
          - done
          - wont_do
          - leave
          title: Subtasks
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          description: A comment explaining the close, up to 10,000 characters; only with `resolution=wont_do`.
          title: Note
      title: CloseSchema
      type: object
    ResolutionSchema:
      additionalProperties: false
      description: 'Body for `POST /tasks/{number}/resolution`: how the closed task is now to be read, `done` or

        `wont_do`.'
      properties:
        resolution:
          description: '`done` or `wont_do`.'
