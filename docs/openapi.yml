  /api/todo/tasks:
    get:
      operationId: apps_todo_api_tasks_list_tasks
      summary: List Tasks
      parameters:
      - in: query
        name: view
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: View
        required: false
      - in: query
        name: q
        schema:
          default: ''
          title: Q
          type: string
        required: false
      - in: query
        name: mode
        schema:
          default: glob
          title: Mode
          type: string
        required: false
      - in: query
        name: include_closed
        schema:
          default: false
          title: Include Closed
          type: boolean
        required: false
      - in: query
        name: resolution
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Resolution
        required: false
      - in: query
        name: state
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
        required: false
      - in: query
        name: priority
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Priority
        required: false
      - in: query
        name: label
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
        required: false
      - in: query
        name: date_range
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date Range
        required: false
      - in: query
        name: date_from
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date From
        required: false
      - in: query
        name: date_to
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Date To
        required: false
      - in: query
        name: sort
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Sort
        required: false
      - in: query
        name: dir
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Dir
        required: false
      - in: query
        name: parent
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Parent
        required: false
      - in: query
        name: limit
        schema:
          default: 50
          title: Limit
          type: integer
        required: false
      - in: query
        name: offset
        schema:
          default: 0
          title: Offset
          type: integer
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListSchema'
      description: "List the caller's tasks, subtasks included.\n\n- `view`: `today` (open, due today or earlier: the overdue ones, and the On hold and Blocked\n  ones due today or earlier too, which are listed but never *overdue*), `upcoming` (open, due in\n  the next 14 days), `all` (open; the default), `closed` (closed as Done or as Won't do, latest\n  first) or `trash`. (`completed`, this parameter's value before version 2 of the API, is a 400.)\n- `parent`: a task number; lists its subtasks (closed ones too). With a `view`, only those of\n  the subtasks that are in the view.\n- `q`: search the titles, descriptions and comments, ignoring case, accents and punctuation:\n  `*` and `?` are wildcards (`mode=glob`, the default) or a regular expression\n  (`mode=regex`, or `/.../`). 200 characters at most; a 400 for an empty, invalid or too slow\n  pattern. Deleted comments and edit history are not searched.\n- `include_closed`: with `view=all`, closed tasks too (after the open ones).\n  (`include_completed`, this parameter's name before version 2, is a 400.)\n- `resolution`: `done` or `wont_do`: only the closed tasks closed that way. Allowed with\n  `view=closed`, or with `include_closed` (and `view=all`); a 400 otherwise.\n- `state`: comma-separated states, any of `todo`, `in_progress`, `blocked`, `on_hold`; an open\n  task in any of them. Closed tasks are not narrowed by it.\n- `priority`: comma-separated priorities, 0 (none) to 3; any of them.\n- `label`: comma-separated label ids, and `none` for tasks without a label; any of them.\n- `date_range`: `any`, `overdue` (open and due before today, **not** On hold or Blocked tasks:\n  a muted task is never overdue), `today`, `next_7_days`, `next_30_days`, `no_date` or\n  `custom` with `date_from` / `date_to` (`YYYY-MM-DD`, inclusive, either may be left out;\n  dates alone mean `custom`). Relative ranges are the caller's own today.\n- `sort`: `date` (the default), `priority`, `created` or `title`.\n- `dir`: `asc` or `desc`, the direction of the sort (as the All page's arrow): each sort's own\n  default when left out (`date`, `priority` and `title` ascending, `created` newest first), the\n  exact reverse for the other one; a 400 for any other value. Closed tasks stay after the open\n  ones. Without `sort`, `dir` means `sort=date` for `view=all` and `upcoming` (date-sorted by\n  default); for `view=today`, `closed`, `trash` and `parent=`, whose own order is not a sort,\n  it is a 400 `dir: Choose a sort to reverse.`\n- `limit` (1-100, default 50) and `offset` page the result; `count` is the total.\n\nA search, or any of `state`, `priority`, `label` and `date_range`, spends `TODO_SEARCH_USER`.\n\n**Snippets.** With `q`, each task also carries `search_field`, `search_snippet`, `match_start`\nand `match_end` (see `TaskListItemSchema`): plain text around the match and its offsets, found\nby the website's bounded pass (a 0.2 s budget for the page, only the field the database said\nmatched, at most 5,000 characters of it; rows past the budget are listed without a snippet).\nWithout `q` all four are `null`."
      tags:
      - To-do
      security:
      - JWTAuth: []
    post:
      operationId: apps_todo_api_tasks_create_task
      summary: Create Task
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCreatedSchema'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnpaidBlockSchema'
      description: 'Create a task (or a subtask with `parent`). It counts toward the month''s free tasks and then

        costs the task price: a 402 when the balance can''t cover it, and a 409

        (`{detail, unpaid_task_numbers}`) while an occurrence of a repeating task is waiting to be paid

        for (a top-up settles it). `source` is `api`.


        See `TaskCreateSchema` for the body, `parse_title`, `reminders`, `state` and `blocked_by` in

        particular; `parsed` in the answer says what `parse_title` did.


        The request is checked first (the fields, the 409, the cap on open tasks, the balance, the

        reminders, the state and the blockers; a title over 500 characters is a 422), and only then are `TODO_CREATE_USER` and, for

        `parse_title`, the date reader''s budget spent: a refused request costs neither and never calls

        the model. What only the creating transaction can decide (a race for the last slot or the last

        credits, a repeat rule that fails against the final date) is still refused after the create

        budget was spent.'
      tags:
      - To-do
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateSchema'
        required: true
      security:
      - JWTAuth: []
