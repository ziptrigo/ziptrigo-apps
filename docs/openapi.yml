          - maxLength: 16
            type: string
          - type: 'null'
          description: Short code for URL shortening
          title: Short Code
        qr_format:
          default: png
          maxLength: 10
          title: Qr Format
          type: string
        size:
          default: 10
          description: Scale factor for QR code size
          title: Size
          type: integer
        error_correction:
          default: M
          maxLength: 1
          title: Error Correction
          type: string
        border:
          default: 4
          description: Border size (quiet zone)
          title: Border
          type: integer
        background_color:
          default: white
          description: Background color (hex, name, or "transparent")
          maxLength: 20
          title: Background Color
          type: string
        foreground_color:
          default: black
          description: Foreground (data) color
          maxLength: 20
          title: Foreground Color
          type: string
        image_file:
          description: Path to generated image file
          maxLength: 255
          title: Image File
          type: string
        scan_count:
          default: 0
          description: Number of times QR code was scanned
          title: Scan Count
          type: integer
        last_scanned_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Scanned At
        created_at:
          format: date-time
          title: Created At
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        redirect_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Redirect Url
      required:
      - qr_type
      - content
      - image_file
      - created_at
      - updated_at
      title: QRCodeSchema
      type: object
    QRCodeCreateSchema:
      description: Schema for creating QR codes.
      properties:
        name:
          default: Untitled QR Code
          description: Name of the QR code
          maxLength: 255
          title: Name
          type: string
        qr_type:
          description: Type of QR code content
          maxLength: 10
          title: Qr Type
          type: string
        qr_format:
          default: png
          maxLength: 10
          title: Qr Format
          type: string
        size:
          default: 10
          description: Scale factor for QR code size
          title: Size
          type: integer
        error_correction:
          default: M
          maxLength: 1
          title: Error Correction
          type: string
        border:
          default: 4
          description: Border size (quiet zone)
          title: Border
          type: integer
        background_color:
          default: white
          description: Background color (hex, name, or "transparent")
          maxLength: 20
          title: Background Color
          type: string
        foreground_color:
          default: black
          description: Foreground (data) color
          maxLength: 20
          title: Foreground Color
          type: string
        use_url_shortening:
          default: false
          description: Whether to use URL shortening
