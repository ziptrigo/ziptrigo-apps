name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # `uv sync` above is already `--frozen`; this keeps every later `uv run` frozen too, so a
      # drifted lockfile fails loudly instead of `uv run` silently re-resolving/syncing.
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so the step below can diff against the PR's base or the previous push.
          fetch-depth: 0

      # The test suite runs only when a file under `apps/` changed: the suite takes about 20
      # minutes, and a change elsewhere (docs, `admin/` CLIs, `tests_e2e/`, workflows) doesn't
      # need it. Lint always runs. When there is nothing to compare with (a new branch's first
      # push), the tests run.
      - name: Check for changes under apps/
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$PR_BASE"
          else
            base="$PUSH_BEFORE"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base commit to compare with: running the tests."
            echo "apps=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" "$HEAD" | grep -q '^apps/'; then
            echo "Files under apps/ changed: running the tests."
            echo "apps=true" >> "$GITHUB_OUTPUT"
          else
            echo "No file under apps/ changed: skipping the tests."
            echo "apps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: '.python-version'

      # `admin/pip.py`'s own sync command (`inv pip sync`); done as its own step so a lockfile
      # mismatch fails here rather than inside the first `inv` invocation below.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Mirrors the checks documented in CLAUDE.md/README.md: `inv lint all --check` (ruff +
      # ty + import-linter, report-only) and `inv test unit` (the whole suite, via pytest).
      - name: Lint
        run: uv run inv lint all --check

      - name: Test
        if: steps.changes.outputs.apps == 'true'
        run: uv run inv test unit
