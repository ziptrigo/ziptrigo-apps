name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `uv sync` above is already `--frozen`; this keeps every later `uv run` frozen too, so a
      # drifted lockfile fails loudly instead of `uv run` silently re-resolving/syncing.
      UV_FROZEN: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: '.python-version'

      # `admin/pip.py`'s own sync command (`inv pip sync`); done as its own step so a lockfile
      # mismatch fails here rather than inside the first `inv` invocation below.
      - name: Install dependencies
        run: uv sync --frozen --all-groups

      # Mirrors the checks documented in CLAUDE.md/README.md: `inv lint all --check` (ruff +
      # ty + import-linter, report-only) and `inv test unit` (the whole suite, via pytest).
      - name: Lint
        run: uv run inv lint all --check

      - name: Test
        run: uv run inv test unit
